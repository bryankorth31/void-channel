<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID Player States</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../src/player.css">
<style>
body{margin:0;background:#07080c;color:#e8e8ee;font:14px system-ui,Segoe UI,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}p{color:#9aa0b4;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
figure{margin:0}figcaption{margin-top:6px;color:#9aa0b4;font-size:12px}
</style></head><body>
<h1>VOID player: motion states</h1>
<p>The animations that need no logo and the two failure cards, each frozen in its state on a real player. No video loads here. The third figure is the card for cause "network" (the Archive stopped sending); the last is the card for cause "format".</p>
<div class="grid">
  <figure><div id="s1"></div><figcaption>Tuning in (loading): the signal pulses outward</figcaption></figure>
  <figure><div id="s2"></div><figcaption>Recovering: gold, sweeping back in, with the reason</figcaption></figure>
  <figure><div id="s3"></div><figcaption>No signal: faint static, twice a second at most</figcaption></figure>
  <figure><div id="s4"></div><figcaption>Up next: the ring drains over the countdown</figcaption></figure>
  <figure><div id="s5"></div><figcaption>Cannot play here (cause: format): the card for a file this browser cannot decode</figcaption></figure>
</div>
<script src="../src/core.js"></script><script src="../src/icons.js"></script><script src="../src/player.js"></script>
<script>
const mk = (id) => VoidPlayer.create(document.getElementById(id), { resolveServers: false, onNext: () => {} });
const freeze = (p) => { clearInterval(p._loop); p.root.classList.remove('paused'); };
const a = mk('s1'); freeze(a); a.root.classList.add('vpx-wait');
const b = mk('s2'); freeze(b); b.root.classList.add('vpx-wait', 'vpx-recovering'); b._status('Switching to the backup server…');
const c = mk('s3'); freeze(c); c.ep = { files: [{ url: '#' }] }; c._failure('starved', 'network');
const d = mk('s4'); freeze(d); d.upNext('The Wolf and the Deer', 10);
const e = mk('s5'); freeze(e); e.ep = { files: [{ url: '#' }] }; e._failure('error-fatal', 'format');
</script></body></html>
