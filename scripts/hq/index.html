<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>voidtv.net HQ</title>
<meta name="hq-token" content="__HQ_TOKEN__">
<link rel="icon" href="/brand/favicon.png">
<style>
@font-face{font-family:'Unbounded';font-weight:200 900;src:url(/brand/fonts/unbounded-latin.woff2) format('woff2')}
:root{--bg:#07080c;--panel:#0f1118;--panel2:#161a24;--line:#1d2130;--fg:#e8e8ee;--dim:#8a8fa3;--acc:#5fd4ff;--gold:#f2a93b;--red:#ff5c6c;--green:#3fcf5a;--rev:#f3c969}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0a0b10;position:sticky;top:0;z-index:5}
header img{width:30px;height:30px;border-radius:50%}header .wm{font-family:Unbounded;font-weight:800;font-size:18px}header .wm span{color:var(--acc);font-weight:500}header .hq{font-family:Unbounded;font-weight:500;color:var(--gold);font-size:13px;letter-spacing:.08em;margin-left:-6px}
nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}nav a{padding:7px 12px;border-radius:8px;color:var(--dim);cursor:pointer;text-decoration:none}nav a.on{background:var(--panel2);color:var(--fg)}nav a:hover{color:var(--fg)}
header .right{margin-left:auto;color:var(--dim);font-size:12px;display:flex;gap:14px;align-items:center}
main{padding:16px 18px 60px;max-width:1500px}
h2{font-family:Unbounded;font-weight:500;font-size:16px;margin:18px 0 10px}h2 small{font-family:system-ui;color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.card b{display:block;font-family:Unbounded;font-weight:500;font-size:22px}.card small{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:rgba(255,255,255,.02)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--dim);margin-right:4px}.chip.live{border-color:var(--green);color:var(--green)}.chip.review{border-color:var(--rev);color:var(--rev)}.chip.missing{border-color:#444;color:#777}.chip.hidden{border-color:var(--red);color:var(--red)}.chip.on{border-color:var(--acc);color:var(--acc)}
button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}button:hover{border-color:var(--acc)}button.gold{background:var(--gold);color:#07080c;border-color:var(--gold);font-weight:600}button.red{border-color:var(--red);color:var(--red)}button.sm{padding:3px 8px;font-size:12px}button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:7px 10px;border-radius:8px;font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
pre{background:#000;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 Consolas,monospace;white-space:pre-wrap;max-height:360px;overflow:auto;color:#b9c0d0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.dim{color:var(--dim)}.gold{color:var(--gold)}.acc{color:var(--acc)}.red{color:var(--red)}.green{color:var(--green)}
.showhead{display:flex;gap:16px;align-items:flex-start}.showhead img{width:92px;border-radius:8px}
.ep.on td{background:rgba(95,212,255,.06)}
video{width:100%;max-width:720px;background:#000;border-radius:8px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--acc);padding:10px 14px;border-radius:10px;z-index:9;max-width:420px}
.orderlist{list-style:none;padding:0;margin:0;max-width:520px}.orderlist li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.orderlist li .k{width:60px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.orderlist li .n{flex:1}
.help p{max-width:820px}
</style></head><body>
<header><img src="/brand/icon-192.png" alt=""><span class="wm">VOID<span>tv</span></span><span class="hq">HQ</span>
<nav id="nav"></nav>
<div class="right"><span id="gitline"></span><a class="btn" href="http://127.0.0.1:8792/lab/" target="_blank" rel="noopener" style="text-decoration:none" title="The player lab: test playback, sync and stalls on this PC. In the HQ app it opens in its own window.">Player lab</a><button class="gold" onclick="publish()">Publish now</button><button class="sm" onclick="publish('--allow-shrink')" title="Use after publish.log says refused: the catalog is more than 10% smaller than the last published one">Publish anyway (shrink)</button><button class="sm" onclick="publish('--allow-other-commits')" title="Use after publish.log says held: commits from other chats are waiting on this PC">Push with other commits</button></div></header>
<main id="main"></main>
<script>
const $=(s,r)=>(r||document).querySelector(s);const jq=(v)=>esc(JSON.stringify(String(v==null?'':v)));const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HQ_TOKEN=(document.querySelector('meta[name=hq-token]')||{}).content||''; // HQ writes a fresh secret into this page each time it starts; every POST sends it back
const api=async(p,o)=>{const r=await fetch(p,o?{method:'POST',headers:{'content-type':'application/json','x-hq-token':HQ_TOKEN},body:JSON.stringify(o)}:undefined);const j=await r.json();if(j.error)throw new Error(j.error);return j};
const fmt=(n)=>n==null?'':Number(n).toLocaleString();const pct=(a,b)=>b?Math.round(a/b*100):0;
const TABS=[['overview','Overview'],['shows','Shows'],['jobs','Jobs'],['reports','Reports'],['analytics','Analytics'],['qr','QR codes'],['add','Add shows'],['order','Home order'],['motion','Motion'],['promos','Promos'],['help','Help']];
let tab=location.hash.slice(1).split('/')[0]||'overview';let showSlug=location.hash.split('/')[1]||null;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
function nav(){$('#nav').innerHTML=TABS.map(([k,n])=>'<a class="'+(k===tab?'on':'')+'" href="#'+k+'">'+n+'</a>').join('')}
window.addEventListener('hashchange',()=>{tab=location.hash.slice(1).split('/')[0]||'overview';showSlug=location.hash.split('/')[1]||null;render()});
async function render(){nav();const m=$('#main');m.innerHTML='<p class="dim">Loading…</p>';try{await({overview,shows,jobs,reports,analytics,qr,add,order,motion,promos,help}[tab]||overview)(m)}catch(e){m.innerHTML='<p class="red">'+esc(e.message)+'</p>'}}
const PUBLISH_ASK={'':'Commit the catalog and docs and push to GitHub? Cloudflare rebuilds the site in about a minute.','--allow-shrink':'The catalog is more than 10% smaller than the last published one. Publish it anyway?','--allow-other-commits':'Other commits are waiting on this PC. Push them together with the catalog?'};
async function publish(flag){flag=flag||'';if(!(flag in PUBLISH_ASK)||!confirm(PUBLISH_ASK[flag]))return;try{const j=await api('/api/jobs',{name:'publish',args:flag?[flag]:[]});toast('Publishing… job '+j.id);location.hash='#jobs'}catch(e){toast(e.message)}}

// ---- overview ----
function healthPanel(h){if(!h||!h.checks||!h.checks.length)return '<div class="panel" style="margin-bottom:14px"><h2 style="margin:0 0 6px">Health</h2><p class="dim">No doctor run yet.</p><div class="row"><button onclick="runDoctor()">Run doctor</button></div></div>';const col={green:'var(--green)',yellow:'var(--rev)',red:'var(--red)'};const age=Math.round((Date.now()-new Date(h.at).getTime())/36e5);return '<div class="panel" style="margin-bottom:14px;border-color:'+col[h.level]+'"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Health <small>'+h.level+' · checked '+age+' h ago</small></h2><span><button class="sm" onclick="runDoctor()">Run doctor</button> <button class="sm" onclick="recreateTasks()">Re-create scheduled tasks</button> <a class="sm" href="#help">runbook</a></span></div><table>'+h.checks.map(c=>'<tr><td style="width:14px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+col[c.level]+'"></span></td><td class="dim" style="white-space:nowrap">'+esc(c.id)+'</td><td>'+esc(c.msg)+(c.fix?'<br><small class="gold">'+esc(c.fix)+'</small>':'')+'</td></tr>').join('')+'</table></div>'}
async function runDoctor(){const j=await api('/api/jobs',{name:'doctor',args:[]});toast('Doctor running…');await waitJob(j.id);render()}
async function recreateTasks(){if(!confirm('Re-create the two Windows scheduled tasks (VoidTV Publish every 2 hours, VoidTV Nightly at 3:30)?'))return;try{const r=await api('/api/tasks/recreate',{});toast('Created: '+r.made.join(', '))}catch(e){toast('Failed: '+e.message)}render()}
async function overview(m){const [o,hz]=await Promise.all([api('/api/overview'),api('/api/health').catch(()=>null)]);const t=o.totals;$('#gitline').textContent=(o.siteName?o.siteName+' · ':'')+o.git.head+(o.git.dirty?' · '+o.git.dirty+' unpublished files':' · nothing to publish');
 const rowTable=(obj,label)=>'<table><tr><th>'+label+'</th><th class="num">listed</th><th class="num">hunted</th><th class="num">playing</th><th class="num">review only</th><th>fill</th></tr>'+Object.entries(obj).sort((a,b)=>b[1].playing-a[1].playing).map(([k,v])=>'<tr><td><a href="#shows/'+(label==='Row'?'type=':'tag=')+encodeURIComponent(k)+'">'+esc(k)+'</a></td><td class="num">'+v.listed+'</td><td class="num">'+v.hunted+'</td><td class="num green">'+v.playing+'</td><td class="num">'+v.review+'</td><td><div class="bar"><i style="width:'+pct(v.playing,v.listed)+'%"></i></div></td></tr>').join('')+'</table>';
 m.innerHTML=healthPanel(hz)+'<div class="cards"><div class="card"><b>'+fmt(t.playing)+'</b><small>shows playing</small></div><div class="card"><b>'+fmt(t.episodesPlaying)+'</b><small>episodes playing</small></div><div class="card"><b>'+fmt(t.episodesReview)+'</b><small>episodes in review</small></div><div class="card"><b>'+fmt(t.hunted)+' / '+fmt(t.listed)+'</b><small>hunted of listed</small></div><div class="card"><b>'+fmt(t.hidden)+'</b><small>hidden by you</small></div><div class="card"><b>'+(o.analytics?'on':'off')+'</b><small>analytics token</small></div></div>'
 +'<div class="grid2"><div><h2>Running now</h2>'+(o.processes.length?'<table>'+o.processes.map(p=>'<tr><td>'+esc(p.cmd)+'</td><td class="dim">'+esc(String(p.started).slice(0,14))+'</td><td><button class="sm red" onclick="stopPid('+p.pid+','+jq(p.started)+')">stop</button></td></tr>').join('')+'</table>':'<p class="dim">No builder jobs running.</p>')
 +'<h2>Last publish</h2><pre>'+esc(o.publishLog||'(none)')+'</pre><h2>Nightly</h2><pre>'+esc(o.nightlyLog||'(none)')+'</pre><h2>Scheduled tasks</h2>'+(o.tasks.length?'<table>'+o.tasks.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.status)+'</td><td class="dim">last '+esc(x.last)+' ('+esc(x.result)+')</td><td class="dim">next '+esc(x.next)+'</td></tr>').join('')+'</table>':'<p class="dim">none found</p>')+'</div>'
 +'<div><h2>Rows</h2>'+rowTable(o.byType,'Row')+'<h2>Collections</h2>'+rowTable(o.byTag,'Collection')+'</div></div>'}
async function stopPid(pid,started){if(!confirm('Stop process '+pid+'?'))return;try{const r=await api('/api/processes/stop',{pid,started});toast(r.stopped===false?r.note:'stopped')}catch(e){toast(e.message)}render()}

// ---- shows ----
let SHOWS=null,sortKey='name',sortDir=1;
async function shows(m){if(showSlug&&!showSlug.includes('='))return showPage(m,showSlug);
 if(!SHOWS)SHOWS=await api('/api/shows');const q=new URLSearchParams(showSlug||'');const f={q:q.get('q')||'',type:q.get('type')||'',tag:q.get('tag')||'',state:q.get('state')||''};
 const tags=[...new Set(SHOWS.rows.flatMap(r=>r.tags))].sort();
 m.innerHTML='<div class="row"><input id="fq" placeholder="search name…" value="'+esc(f.q)+'" style="width:220px"><select id="ft"><option value="">all rows</option>'+SHOWS.types.map(t=>'<option'+(t===f.type?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select><select id="fg"><option value="">all collections</option>'+tags.map(t=>'<option'+(t===f.tag?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select><select id="fs"><option value="">any state</option>'+[['playing','playing'],['review','review only (needs a look)'],['unplayable','has unplayable picks'],['missing','hunted, nothing found'],['unhunted','not hunted yet'],['hidden','hidden'],['edited','edited by you'],['self','self-listed (no TVmaze)']].map(([v,n])=>'<option value="'+v+'"'+(v===f.state?' selected':'')+'>'+n+'</option>').join('')+'</select><button onclick="applyFilters()">Filter</button><span class="dim" id="fcount"></span></div><div id="stable"></div>';
 ['fq','ft','fg','fs'].forEach(id=>$('#'+id).addEventListener('change',applyFilters));$('#fq').addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters()});
 drawShows(f)}
function applyFilters(){const p=new URLSearchParams();if($('#fq').value)p.set('q',$('#fq').value);if($('#ft').value)p.set('type',$('#ft').value);if($('#fg').value)p.set('tag',$('#fg').value);if($('#fs').value)p.set('state',$('#fs').value);location.hash='#shows/'+p.toString()}
function drawShows(f){let rows=SHOWS.rows.filter(r=>(!f.q||r.name.toLowerCase().includes(f.q.toLowerCase()))&&(!f.type||r.type===f.type)&&(!f.tag||r.tags.includes(f.tag)));
 const st=f.state;rows=rows.filter(r=>{const s=r.stats;switch(st){case 'playing':return s&&s.playing>0;case 'review':return s&&s.review>0;case 'unplayable':return s&&s.unplayable>0;case 'missing':return r.hunted&&(!s||s.total===0||(s.live+s.review)===0);case 'unhunted':return !r.hunted;case 'hidden':return r.hidden;case 'edited':return r.edited;case 'self':return r.selfListed;default:return true}});
 const val=(r,k)=>k==='name'?r.name.toLowerCase():k==='playing'?(r.stats?r.stats.playing:-1):k==='review'?(r.stats?r.stats.review:-1):k==='total'?(r.stats?r.stats.total:-1):k==='matchedAt'?(r.matchedAt||''):(r[k]||'');
 rows.sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey);return (x>y?1:x<y?-1:0)*sortDir});
 $('#fcount').textContent=rows.length+' shows';
 const th=(k,n,cls)=>'<th class="'+(cls||'')+'" onclick="sortBy(\''+k+'\')">'+n+(sortKey===k?(sortDir>0?' ▲':' ▼'):'')+'</th>';
 $('#stable').innerHTML='<table><tr>'+th('name','Show')+th('type','Row')+'<th>Collections</th>'+th('network','Network')+th('playing','Playing','num')+th('review','Review','num')+th('total','Episodes','num')+th('matchedAt','Matched')+'<th>Flags</th></tr>'+rows.slice(0,400).map(r=>'<tr><td><a href="#shows/'+encodeURIComponent(r.slug)+'">'+esc(r.name)+'</a></td><td class="dim">'+esc(r.type)+'</td><td class="dim">'+r.tags.map(esc).join(', ')+'</td><td class="dim">'+esc(r.network)+'</td><td class="num green">'+(r.stats?r.stats.playing:'')+'</td><td class="num">'+(r.stats?r.stats.review:'')+'</td><td class="num dim">'+(r.stats?r.stats.total:'')+'</td><td class="dim">'+(r.matchedAt||'').slice(0,10)+'</td><td>'+(r.hidden?'<span class="chip hidden">hidden</span>':'')+(r.edited?'<span class="chip on">edited</span>':'')+(r.selfListed?'<span class="chip">self-listed</span>':'')+(!r.hunted?'<span class="chip missing">not hunted</span>':'')+(r.stats&&r.stats.unplayable?'<span class="chip review">'+r.stats.unplayable+' unplayable</span>':'')+'</td></tr>').join('')+'</table>'+(rows.length>400?'<p class="dim">Showing 400 of '+rows.length+'; narrow the filter.</p>':'')}
function sortBy(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='name'||k==='type'?1:-1}const q=new URLSearchParams(showSlug||'');drawShows({q:q.get('q')||'',type:q.get('type')||'',tag:q.get('tag')||'',state:q.get('state')||''})}

// ---- one show ----
let CUR=null;
async function showPage(m,slug){const d=await api('/api/show/'+encodeURIComponent(slug));CUR=d;const g=d.grid,e=d.entry,ov=d.overrides;
 const fkey=(f)=>f.item+'|'+f.name;const acc=new Set(ov.acceptFiles||[]),rej=new Set(ov.rejectFiles||[]);
 const stat=g?(()=>{let l=0,r=0,mi=0;for(const se of g.seasons)for(const x of se.episodes){if(x.state==='LIVE')l++;else if(x.state==='REVIEW')r++;else mi++}return {l,r,mi}})():null;
 let h='<p><a href="#shows">← all shows</a></p><div class="showhead">'+(d.art&&d.art.poster?'<img src="'+esc(d.art.poster)+'">':'')+'<div><h2 style="margin:0">'+esc(e?e.name:slug)+(ov.hidden?' <span class="chip hidden">hidden from the site</span>':'')+'</h2><p class="dim">'+esc(e?e.type:'')+(e&&e.tags?' · '+e.tags.join(', '):'')+(e&&e.network?' · '+esc(e.network):'')+(g&&g.tvmaze?' · TVmaze #'+g.tvmaze.id+' "'+esc(g.tvmaze.name)+'"'+(g.tvmaze.premiered?' ('+g.tvmaze.premiered.slice(0,4)+')':''):'')+(d.art&&d.art.tmdbId?' · TMDB #'+d.art.tmdbId:'')+'</p>'
 +(stat?'<p><span class="chip live">'+stat.l+' live</span><span class="chip review">'+stat.r+' review</span><span class="chip missing">'+stat.mi+' missing</span>'+(g.selfListed?'<span class="chip">self-listed, no TVmaze list</span>':'')+' <span class="dim">matched '+esc((g.matchedAt||'').slice(0,16).replace('T',' '))+'</span></p>':'<p class="dim">'+(d.candidates?'Hunted ('+d.candidates.items+' Archive items, '+d.candidates.files+' files) but no grid yet: run the matcher.':'Not hunted yet.')+'</p>')
 +'<div class="row"><button onclick="job(\'hunt\',[\'--slug\',showSlug,\'--refresh\'])">Re-hunt now</button><button onclick="job(\'match\',[\'--slug\',showSlug])">Re-match now</button><button onclick="job(\'art\',[\'--slug\',showSlug])">Fetch art</button><button class="'+(ov.hidden?'':'red')+'" onclick="setOv({hidden:'+(ov.hidden?'null':'true')+'},false)">'+(ov.hidden?'Show on the site again':'Hide from the site')+'</button><a class="btn" style="padding:7px 12px" target="_blank" href="https://voidtvsite.pages.dev/show/'+encodeURIComponent(slug)+'">Open on the test site ↗</a></div></div></div>';
 h+='<div class="grid2"><div class="panel"><h3>Identity and search</h3><div class="row"><label>TVmaze id <input id="o-tvmaze" value="'+esc(ov.tvmazeId||'')+'" style="width:100px"></label><label>TMDB id <input id="o-tmdb" value="'+esc(ov.tmdbId||'')+'" style="width:100px"></label><label>Search name <input id="o-search" value="'+esc(ov.searchName||'')+'" style="width:220px" placeholder="plain name to search the Archive for"></label><button onclick="saveIds()">Save</button></div><p class="dim">Set the TVmaze id when the episode list is the wrong show (namesakes). The TMDB id fixes art. The search name helps when the title alone is too generic.</p>'
 +'<h3>Aliases <span class="dim">(other names uploads use)</span></h3><div class="row">'+(ov.aliases||[]).map(a=>'<span class="chip on">'+esc(a)+' <a onclick="setOv({},false,{pull:{aliases:['+jq(a)+']}})" style="cursor:pointer">✕</a></span>').join('')+'<input id="o-alias" placeholder="add alias" style="width:200px"><button onclick="addAlias()">Add</button></div>'
 +'<h3>Excluded Archive items</h3><div class="row">'+(ov.excludeItems||[]).map(a=>'<span class="chip hidden">'+esc(a)+' <a onclick="setOv({},true,{pull:{excludeItems:['+jq(a)+']}})" style="cursor:pointer">✕</a></span>').join('')+'<input id="o-ex" placeholder="archive identifier" style="width:260px"><button onclick="addExclude()">Exclude</button></div>'
 +'<h3>Note</h3><div class="row"><input id="o-note" value="'+esc(ov.note||'')+'" style="width:100%;max-width:520px" placeholder="why you changed something (for future you)"><button onclick="setOv({note:$(\'#o-note\').value},false)">Save note</button></div></div>'
 +'<div class="panel"><h3>Preview</h3><video id="pv" controls preload="none"></video><p id="pvinfo" class="dim">Pick an episode file below to preview it here. Accept only what you watched play.</p></div></div>';
 if(g){h+='<h2>Episodes</h2><p class="dim">Accept = this file is right (goes LIVE, wins over the judges). Reject = never this file again (the matcher re-picks). Alternates are the other candidates the matcher found.</p>';
  for(const se of g.seasons){h+='<h3>Season '+se.season+' <span class="dim">· '+se.episodes.length+' episodes</span></h3><table><tr><th style="width:40px">#</th><th>Episode</th><th>State</th><th>File</th><th>conf</th><th>why</th><th></th></tr>';
   for(const x of se.episodes){const f=x.file;const key=f?fkey(f):'';h+='<tr class="ep"><td class="dim">E'+x.number+'</td><td>'+esc(x.name)+'<br><small class="dim">'+esc(x.airdate||'')+'</small></td><td><span class="chip '+x.state.toLowerCase()+'">'+x.state+'</span>'+(f&&!f.playable?'<br><span class="chip review">unplayable</span>':'')+(f&&f.langRisk?'<br><span class="chip review">foreign?</span>':'')+'</td>'

let QRLIB=null;async function qrlib(){if(QRLIB)return QRLIB;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});QRLIB=window.qrcode;return QRLIB}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

// ---- help ----
function help(m){m.innerHTML='<div class="help"><h2>What HQ is</h2><p>The control room for VOIDtv, running on this PC only. The site itself is static files built from the catalog in this repo; the builder scripts (hunt, match, art, people, publish) write that catalog. HQ is a front for them, so everything here is also a command you could run by hand.</p>'
 +'<h2>How things flow</h2><p><b>Show list</b> (scripts/show-list.json) → <b>hunt</b> finds Archive uploads → <b>match</b> lines files up with the TVmaze episode list and judges each one (LIVE / REVIEW / MISSING) → <b>art</b> and <b>people</b> add posters, cast and credits → <b>publish</b> commits and pushes → Cloudflare rebuilds the site in about a minute.</p>'
 +'<h2>Your edits</h2><p>Everything you decide lands in <code>catalog/overrides.json</code>, which the builder reads and never writes: accepted and rejected files, aliases, excluded Archive items, TVmaze / TMDB ids, search names, hidden shows, notes. Re-running the matcher applies them; HQ does that automatically after each decision on a show page.</p>'
 +'<h2>Daily use</h2><ol><li><b>Reports</b>: see what viewers flagged, open the show, preview the file, Reject or Accept.</li><li><b>Shows → review only</b>: shows with files the judges were unsure about. Watch a minute, Accept.</li><li><b>Analytics → Searches</b>: zero-result searches are things people want. Add them on the Add page.</li><li><b>Publish now</b> (top right) whenever you want the site to catch up; the scheduler also publishes every two hours and the nightly pass runs at 3:30.</li></ol>'
 +'<h2>When a light is not green</h2><p>The Overview shows the doctor\'s lights. <b>publish</b> red: open Jobs > publish.log, the last lines name the file git could not add. If the log says <b>refused</b> (also red), the catalog is more than 10% smaller than the last published one: find out why, and only if it is right press <b>Publish anyway (shrink)</b> at the top. If the drop is meant, also set the Text variable SITE_ALLOW_SHRINK = 1 on Cloudflare for that one deploy and delete it afterwards, or the build refuses it. <b>publish</b> yellow, log says <b>held</b>: commits from other chats are waiting on this PC and publish did not push them; press <b>Push with other commits</b> at the top when they are meant to go. <b>nightly</b> or a <b>task</b> red: press Re-create scheduled tasks on the Overview. <b>jobs</b> red: stop one Archive job in Jobs. <b>build</b> red: the message names the file; usually the catalog folder was emptied, <code>git checkout -- catalog</code> restores it. <b>live</b> yellow: Cloudflare is still building or the build failed, check the Deployments tab there. <b>links</b> red: the Archive took a batch down; dead files are retired and alternates picked on the next match, re-hunt the worst shows. <b>unpushed</b> yellow: commits from other chats are waiting on this PC for your push; look at them, then press <b>Push with other commits</b> at the top. <b>unpushed</b> red: a Catalog commit has waited over 30 minutes without being pushed, so the site is behind; press <b>Publish now</b>, and if publish.log says refused or held, follow that line. <b>addresses</b> red: an address-shaped string is in the catalog folder; the light names the file, remove the string there before the next publish. <b>local-servers</b> red: HQ accepted a request it should have refused (a page from another port, a body that is not JSON, or a call without its token). Close HQ and the desktop app and start them again, then check that scripts/hq.js is the current copy. The new gate, files, www, headers, shrink and backup lights each show their own fix under the message. The full table is docs/RUNBOOK.md in the repo.</p>'+'<h2>Starting HQ</h2><p>Double-click <code>HQ.cmd</code> in the repo folder, or run <code>node scripts/hq.js --open</code>. Keep the window open; closing it stops HQ but not the jobs it started.</p>'
 +'<h2>Motion and Promos</h2><p><b>Motion</b> is the ad and sting editor: change the words or colours of any piece and press Make video. <b>Promos</b> lists every finished video (the editor\'s and the stings in videos/). <b>Send to voidtv.net</b> makes a small web copy in assets/brand/promos and puts it on the promos page, the home banner or the password gate (gate loops stay under 1.5 MB, so only short ones fit). <b>Share copy</b> saves a full-quality MP4 in Videos\\voidtv.net, ready to post. Nothing reaches the site until you press <b>Go live</b> on the Promos tab; the scheduled publish never sends promos.</p>'
 +'<h2>The password gate</h2><p>Lives in the Cloudflare dashboard, not here: Pages → voidtvsite → Settings → Variables and Secrets (Production). To open the site to everyone: delete SITE_PASSWORD, add a Text variable GATE = off, then Deployments → latest → Retry deployment. Both halves are needed: with only the delete, the build is refused and the site stays closed. To close it again: delete GATE, add SITE_PASSWORD as Text, Retry deployment. The whole day, with the three zone clicks, is in docs/DEPLOY.md under Opening day.</p></div>'}

 el.innerHTML='<div class="panel" style="margin-top:8px;background:var(--panel2)"><div class="row" style="margin-top:0"><label><input type="checkbox" value="promos" checked> Promos page</label><label><input type="checkbox" value="home"> Home banner</label><label title="'+(gateOk?'':'Too long for the gate: it must stay under 1.5 MB')+'"><input type="checkbox" value="gate" '+(gateOk?'':'disabled')+'> Password gate'+(gateOk?'':' (too long)')+'</label></div>'
 +'<div class="row"><input id="pst'+i+'" value="'+esc(window._title(r))+'" placeholder="Title on the site" style="flex:1"><button class="sm gold" onclick="promoSend('+i+')">Send</button></div><p class="dim" style="margin:0;font-size:12px">Makes a small web copy in assets/brand/promos. Nothing is public until you press Go live.</p></div>'}
async function promoSend(i){const r=window._lib[i],slots=[...document.querySelectorAll('#ps'+i+' input[type=checkbox]:checked')].map(x=>x.value),title=$('#pst'+i).value.trim();if(!slots.length)return toast('Pick at least one place');
 try{const t=await api('/api/promos/send',{file:r.file,slots,title});toast('Encoding a web copy…');await promoWait(t.id)}catch(e){toast(e.message)}}
async function promoShare(i){const r=window._lib[i];try{const t=await api('/api/promos/share',{file:r.file,title:window._title(r)});toast('Making a share copy…');await promoWait(t.id)}catch(e){toast(e.message)}}
async function promoWait(id){for(let i=0;i<900;i++){await new Promise(r=>setTimeout(r,1000));const t=await api('/api/promos/task/'+id);if(t.state==='done'){toast(t.result&&t.result.path?'Saved: '+t.result.path:'Done: '+t.label);if(tab==='promos')render();return t}if(t.state==='failed'){toast('Failed: '+(t.error||t.label));if(tab==='promos')render();return t}}}
async function promoAct(act,base,shape,slot,dir){try{await api('/api/promos/'+act,{base,shape,slot,dir});render()}catch(e){toast(e.message)}}
async function promoRename(b){const t=prompt('Title on voidtv.net',(window._pd.placements.items[b]||{}).title||b);if(t==null)return;await api('/api/promos/rename',{base:b,title:t}).catch(e=>toast(e.message));render()}
async function promoLive(){const L=window._pd.live;if(!confirm('Put these on voidtv.net?\n\n'+L.changed.join('\n')+(L.ahead.length?'\n\nThese other commits on this PC go out with it:\n'+L.ahead.join('\n'):'')+'\n\nCloudflare rebuilds in about a minute.'))return;
 try{const r=await api('/api/promos/go-live',{});toast(r.pushed?'Pushed '+r.commit+'. Live in about a minute.':r.note);render()}catch(e){toast(e.message)}}
render();
</script></body></html>
