        var slots = 6;
        for (var k = 0; k < slots; k++) {
          var sy = py + ph * (0.2 + (0.6 * k) / (slots - 1));
          svg += rect("slot", px + 0.05 * pw, sy - 2, 0.34 * pw, 4, 2);
        }
        var kr = Math.min(0.3 * ph, 30);
        [0.6, 0.735].forEach(function (f, j) {
          var kx = px + f * pw, ky = py + ph / 2;
          svg += circ("knob", kx, ky, kr) + circ("knob-cap", kx, ky, kr * 0.62);
          var ang = j ? 0.7 : -0.5;
          svg += line("tick", kx + Math.sin(ang) * kr * 0.25, ky - Math.cos(ang) * kr * 0.25, kx + Math.sin(ang) * kr * 0.85, ky - Math.cos(ang) * kr * 0.85, 2.5);
        });
        svg += rect("btn", px + 0.855 * pw, py + ph / 2 - 7, 0.05 * pw, 14, 4);
        svg += circ("led-off", px + 0.94 * pw, py + ph / 2, 3.2);
        svg += circ("led", px + 0.94 * pw, py + ph / 2, 3.2, ' id="led"');
        // backlit rim: the wall glow catches the silhouette's top and upper sides
        var rimY = CABY + CABH * 0.55;
        svg +=
          '<path class="rim" d="M' + r1(CABX + 0.75) + "," + r1(rimY) + " L" + r1(CABX + 0.75) + "," + r1(CABY + crx) + " Q" + r1(CABX + 0.75) + "," + r1(CABY + 0.75) + " " + r1(CABX + crx) + "," + r1(CABY + 0.75) +
          " L" + r1(CABX + CABW - crx) + "," + r1(CABY + 0.75) + " Q" + r1(CABX + CABW - 0.75) + "," + r1(CABY + 0.75) + " " + r1(CABX + CABW - 0.75) + "," + r1(CABY + crx) + " L" + r1(CABX + CABW - 0.75) + "," + r1(rimY) + '"/>';
        svg += "</g>";
        var tvEl = document.getElementById("tv");
        tvEl.setAttribute("width", W);
        tvEl.setAttribute("height", H);
        tvEl.setAttribute("viewBox", "0 0 " + W + " " + H);
        tvEl.innerHTML = svg;

        // ---------------------------------------------------------------- build: screen + picture
        place("halation", SL, ST, SW, SH).style.borderRadius = RAD + "px";
        var scr = place("screen", SL, ST, SW, SH);
        scr.style.borderRadius = RAD + "px";
        document.getElementById("glass").style.boxShadow = "inset 0 0 " + Math.round(0.36 * SH) + "px var(--inset_a), inset 0 0 10px var(--inset_b)";
        var grainEl = document.getElementById("grain");
        grainEl.style.width = Math.ceil(SW / 3) + "px";
        grainEl.style.height = Math.ceil(SH / 3) + "px";

        var WM_INNER = '<b class="wm-a">voidtv</b><i class="wm-b">.net</i>';
        function wm(cls) {
          var hidden = cls.indexOf("core") < 0;
          return '<span class="wm ' + cls + '"' + (hidden ? ' aria-hidden="true" data-layout-ignore' : "") + ">" + WM_INNER + "</span>";
        }
        document.getElementById("pic-stack").innerHTML = wm("wm-bloom") + wm("rgb warm") + wm("rgb cool") + wm("wm-base");
        document.getElementById("lock-stack").innerHTML = wm("wm-bloom") + wm("wm-core");
        document.querySelectorAll("#lock .wm-core b, #lock .wm-core i").forEach(function (el) {
          el.setAttribute("data-layout-allow-occlusion", "true");
        });

        // ---------------------------------------------------------------- build: lockup
        var lock = document.getElementById("lock");
        var shift = 2 * (H / 2 - C.lockCY);
        lock.style.paddingBottom = Math.max(0, shift) + "px";
        lock.style.paddingTop = Math.max(0, -shift) + "px";
        lock.style.setProperty("--feather", C.feather + "px");
        var GAP = Math.round(C.gap * FS);
        document.getElementById("tag").style.marginTop = GAP + "px";
        var inkW = 6.33 * FS;
        var wordCY = C.lockCY - (GAP + 1.2 * C.tfs) / 2; // word box centre: the flex column centres word + gap + tag line
        [["pool-pink", 0.3, C.pools[0]], ["pool-cyan", 0.82, C.pools[1]]].forEach(function (p) {
          var pw = 0.62 * inkW, ph = 0.42 * inkW;
          place(p[0], SX - inkW / 2 + p[1] * inkW - pw / 2, wordCY - ph / 2, pw, ph);
        });

        // ---------------------------------------------------------------- the period, in fixed composition coordinates
        // Unbounded 700, measured once in headless Chrome (Range + canvas ink metrics), in em of the word box:
        // the "." ink centre sits +0.917em right of and +0.27em below the centre of the 6.36em x 1em word box;
        // its ink is 0.24em x 0.23em. The lockup is centred, so no runtime measurement is needed.
        var PERIOD_EM = { dx: 0.9172, dy: 0.27, d: 0.235 };
        var P = { x: W / 2 + PERIOD_EM.dx * FS, y: wordCY + PERIOD_EM.dy * FS, d: PERIOD_EM.d * FS };
        lock.style.setProperty("--mx", r1(P.x) + "px");
        lock.style.setProperty("--my", r1(P.y) + "px");

        // ---------------------------------------------------------------- timeline
        var tl = gsap.timeline({ paused: true });

        // camera: one slow push on the screen centre for the whole piece
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: 5, ease: "none" }, 0);
        function camScale(t) {
          return 1 + (0.06 * Math.min(Math.max(t, 0), 5)) / 5;
        }

        // POWER-OFF: the picture squeezes into the line (no brightening), the LED goes out
        tl.fromTo("#pic", { scaleY: 1 }, { scaleY: 0.02, duration: T.line - T.off, ease: "power2.in" }, T.off);
        tl.fromTo("#pic", { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none" }, T.line - 0.06);
        tl.fromTo("#led", { opacity: 0.8 }, { opacity: 0, duration: 0.14, ease: "power1.out" }, T.off);

        // IGNITION 3.00-3.78: one slow move outward from the period; then the hold
        var IGN = T.lit - T.land;
        tl.fromTo("#lock", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.55, ease: "power1.out" }, T.land);
        tl.fromTo("#lock", { "--rv": "0px" }, { "--rv": C.rvEnd + "px", duration: IGN, ease: "sine.inOut" }, T.land);
        tl.fromTo("#lock .wm-bloom", { opacity: 0 }, { opacity: C.bloom, duration: IGN - 0.1, ease: "sine.inOut" }, T.land + 0.1);
        tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, T.lit - 0.5);
        tl.fromTo("#pool-pink", { opacity: 0 }, { opacity: C.pools[0], duration: IGN, ease: "sine.out" }, T.land);
        tl.fromTo("#pool-cyan", { opacity: 0 }, { opacity: C.pools[1], duration: IGN, ease: "sine.out" }, T.land);

        // ---------------------------------------------------------------- procedural layer (pure functions of t)
        var turb = document.getElementById("turb");
        var film = document.getElementById("film-grain");
        var vig = document.getElementById("hf-vignette");
        var hum = document.getElementById("hum");
        var core = document.getElementById("beam-core");
        var blue = document.getElementById("beam-blue");
        var beam = document.getElementById("beam");
        var e2in = gsap.parseEase("power2.in");
        var sio = gsap.parseEase("sine.inOut");
        var sout = gsap.parseEase("sine.out");
        function cl(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }
        function seg(t, a, b) {
          return cl((t - a) / (b - a));
        }
        function lerp(a, b, u) {
          return a + (b - a) * u;
        }
        function lcg(n) {
          var s = (Math.imul(n + 0x9e37, 1664525) + 1013904223) >>> 0;
          s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
          return s;
        }
        // the light the screen throws: ONE monotonic darkening, 1 -> 0 over 1.2-3.0
        function lightAt(t) {
          if (t < T.off) return 1;
          if (t < T.line) {
            var u = seg(t, T.off, T.line);
            return 1 - 0.64 * u * u;
          }
          if (t < T.dot) return 0.36 - 0.24 * seg(t, T.line, T.dot);
          var v = 1 - seg(t, T.dot, T.land);
          return 0.12 * v * v;
        }
        function show(el, o) {
          el.style.opacity = o.toFixed(3);
          el.style.visibility = o > 0.001 ? "visible" : "hidden";
        }
        var lastSeed = -1;
        function frame(t) {
          var f = Math.floor(t * 30 + 1e-4);
          var L = lightAt(t);
          cam.style.setProperty("--L", L.toFixed(4));
          cam.style.setProperty("--L2", (L * L).toFixed(4));
          // the vignette only has work while the room is lit; over the bare room colour it is a no-op that bands by 1/255
          vig.style.opacity = L.toFixed(4);
          // fine static on the picture: one seed per frame while the picture exists (constant mean)
          var seed = 1 + Math.min(f, Math.round(T.line * 30) + 1);
          if (seed !== lastSeed) {
            turb.setAttribute("seed", String(seed));
            lastSeed = seed;
          }
          // film grain: noise.png offset from a seeded LCG every 2 frames
          var n = lcg(Math.floor(f / 2));
          film.style.backgroundPosition = (n % 160) + "px " + ((n >>> 9) % 160) + "px";
          // hum bar: slow downward drift (0.16 screen heights per second)
          var ph = (0.3 + t * 0.16) % 1;
          hum.style.transform = "translateY(" + ((-0.24 + ph * 1.24) * SH).toFixed(1) + "px)";

          // the beam: line -> dot -> period, all in frame px
          var cs = camScale(t);
          var lineW = SW * cs * 0.97;
          var x = SX, y = SY, w = 0, h = 0, co = 0, bo = 0;
          if (t >= T.lineIn && t < T.dot) {
            co = seg(t, T.lineIn, T.line);
            var u = e2in(seg(t, T.shrink, T.dot));
            w = lerp(lineW, C.dot0, u);
            var hu = cl((u - 0.55) / 0.45);
            h = lerp(C.line, C.dot0, hu * hu);
          } else if (t >= T.dot) {
            var g = sio(seg(t, T.grow0, T.land));
            w = h = lerp(C.dot0, P.d, g);
            var m = sio(seg(t, T.drift0, T.land));
            x = lerp(SX, P.x, m);
            y = lerp(SY, P.y, m);
            // afterglow: fades slowly (1 -> 0.55), then hands over to the blue of ".net"
            var glow = lerp(1, 0.55, sout(seg(t, T.dot, T.tint0)));
            var tint = sio(seg(t, T.tint0, T.land));
            co = glow * (1 - tint);
            bo = glow * tint;
            if (t >= T.land) {
              bo = lerp(0.55, 1, sout(seg(t, T.land, T.land + 0.3)));
              bo *= 1 - sio(seg(t, T.land + 0.45, T.lit));
            }
          }
          beam.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
          core.style.width = w.toFixed(2) + "px";
          core.style.height = h.toFixed(2) + "px";
          blue.style.width = w.toFixed(2) + "px";
          blue.style.height = h.toFixed(2) + "px";
          show(core, co);
          show(blue, bo);
        }
        var clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          {
            t: 5,
            duration: 5,
            ease: "none",
            onUpdate: function () {
              frame(clock.t);
            },
          },
          0,
        );
        frame(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
