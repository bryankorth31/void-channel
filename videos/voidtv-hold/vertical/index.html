    <script>
      (function () {
        "use strict";

        // ---------------------------------------------------------------- format
        var root = document.getElementById("root");
        var W = Number(root.dataset.width);
        var H = Number(root.dataset.height);
        var FMT = W > H ? "16x9" : "9x16";
        var CONFIGS = {
          // word: font px (ink ~6.33em), word centre y, tagline font px and its centre y

        var CFG = CONFIGS[FMT];
        var FS = CFG.font;
        var M = Math.min(W, H);
        var B = Math.round(0.13 * H); // blanking bar height
        var P = H + B; // one roll period: bar + picture

        root.style.setProperty("--fs", FS + "px");
        root.style.setProperty("--tfs", CFG.tagFont + "px");
        root.style.setProperty("--field-size", CFG.field);
        root.style.setProperty("--field-y", ((CFG.wordY / H) * 100).toFixed(2) + "%");

        // deterministic helpers (no Math.random, no clocks)
        function glitchHash(n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }
        function lcg(k) {
          var s = (Math.imul(k + 0x9e37, 1664525) + 1013904223) >>> 0;
          s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
          return s;
        }
        function r1(v) {
          return Math.round(v * 10) / 10;
        }

        var WM_INNER = '<b class="wm-a">voidtv</b><i class="wm-b">.net</i>';
        function wm(cls, real) {
          return '<span class="wm ' + cls + '"' + (real ? "" : ' aria-hidden="true" data-layout-ignore') + ">" + WM_INNER + "</span>";
        }

        // ---------------------------------------------------------------- picture strip: [bar][picture] x 2
        var strip = document.getElementById("strip");
        strip.style.height = 2 * P + "px";
        var sHtml = "";
        for (var k = 0; k < 2; k++) {
          var real = k === 1; // cell 1 is the one that comes to rest
          sHtml += '<div class="cell" style="top:' + k * P + "px;height:" + P + 'px"' + (real ? "" : " data-layout-ignore") + ">";
          sHtml += '<div class="vbar" style="height:' + B + 'px"></div>';
          sHtml += '<div class="plate" style="top:' + B + "px;height:" + H + "px;padding-top:" + (CFG.wordY - FS / 2) + 'px">';
          sHtml += '<div class="wm-stack sig"' + (real ? ' role="img" aria-label="voidtv.net"' : "") + ">";
          sHtml += wm("rgb warm") + wm("rgb cool") + wm("wm-bloom") + wm("wm-base", real);
          sHtml += "</div></div></div>";

        strip.querySelectorAll(".wm-base b, .wm-base i").forEach(function (el) {
          el.setAttribute("data-layout-allow-occlusion", "true");
        });

        // tagline
        document.getElementById("tag-layer").style.paddingTop = CFG.tagY - CFG.tagFont / 2 + "px";

        // static plane
        var grainEl = document.getElementById("grain");
        grainEl.style.width = Math.ceil(W / 3) + "px";
        grainEl.style.height = Math.ceil(H / 3) + "px";
        var HB = Math.round(0.24 * H); // hum band height
        var hums = document.querySelectorAll(".hum");
        hums.forEach(function (h) {
          h.style.height = HB + "px";
        });

        // halation pools around the resting word (pink under "voidtv", cyan under ".net")
        var inkW = 6.33 * FS;
        [["pool-pink", 0.315, 0.66], ["pool-cyan", 0.815, 0.5]].forEach(function (p) {
          var el = document.getElementById(p[0]);
          var pw = p[2] * inkW * 1.2, ph = 1.6 * FS;
          el.style.left = r1(W / 2 - inkW / 2 + p[1] * inkW - pw / 2) + "px";
          el.style.top = r1(CFG.wordY - ph / 2) + "px";
          el.style.width = r1(pw) + "px";
          el.style.height = r1(ph) + "px";
        });

        // ---------------------------------------------------------------- glass: curved scanlines (barrel)
        // barrel map y' = cy + dy * (1 - K * (dx^2 + dy^2) / R^2): every scanline is a parabola in x,
        // drawn exactly as one quadratic bezier.
        var CX = W / 2, CY = H / 2, K = 0.04, RN = Math.max(W, H) / 2;
        function bowY(dy, dx) {
          return CY + dy * (1 - (K * (dx * dx + dy * dy)) / (RN * RN));
        }
        var scan = document.getElementById("scan");
        scan.setAttribute("width", W);
        scan.setAttribute("height", H);
        scan.setAttribute("viewBox", "0 0 " + W + " " + H);
        var lines = "";
        var PITCH = 4;
        var reach = Math.ceil((H / 2) * 1.08 / PITCH) * PITCH;
        for (var dy = -reach + PITCH / 2; dy < reach; dy += PITCH) {
          var ym = bowY(dy, 0), ye = bowY(dy, W / 2);

          lines += '<path d="M-2 ' + r1(ye) + " Q" + CX + " " + r1(2 * ym - ye) + " " + (W + 2) + " " + r1(ye) + '"/>';
        }
        scan.innerHTML = lines;

        // ---------------------------------------------------------------- glass: tube face (rounded corners, bowed sides)
        var tube = document.getElementById("tube");
        tube.setAttribute("width", W);
        tube.setAttribute("height", H);
        tube.setAttribute("viewBox", "0 0 " + W + " " + H);
        var IN = 0.013 * M, BU = 0.026 * M, RC = 0.115 * M;
        var x0 = IN, y0 = IN, x1 = W - IN, y1 = H - IN;

          "M" + r1(x0 + RC) + " " + r1(y0) +
          " Q" + r1(CX) + " " + r1(y0 - 2 * BU) + " " + r1(x1 - RC) + " " + r1(y0) +
          " Q" + r1(x1) + " " + r1(y0) + " " + r1(x1) + " " + r1(y0 + RC) +
          " Q" + r1(x1 + 2 * BU) + " " + r1(CY) + " " + r1(x1) + " " + r1(y1 - RC) +
          " Q" + r1(x1) + " " + r1(y1) + " " + r1(x1 - RC) + " " + r1(y1) +
          " Q" + r1(CX) + " " + r1(y1 + 2 * BU) + " " + r1(x0 + RC) + " " + r1(y1) +
          " Q" + r1(x0) + " " + r1(y1) + " " + r1(x0) + " " + r1(y1 - RC) +
          " Q" + r1(x0 - 2 * BU) + " " + r1(CY) + " " + r1(x0) + " " + r1(y0 + RC) +
          " Q" + r1(x0) + " " + r1(y0) + " " + r1(x0 + RC) + " " + r1(y0) + " Z";
        var E = 200;
        var tHtml = "<defs>";
        tHtml += '<filter id="tube-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="' + r1(0.006 * M) + '"/></filter>';
        tHtml += '<filter id="tube-wide" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="' + r1(0.045 * M) + '"/></filter>';
        tHtml += '<clipPath id="tube-in"><path d="' + face + '"/></clipPath>';
        tHtml += "</defs>";
        // inner edge falloff following the curved face
        tHtml += '<g clip-path="url(#tube-in)"><path class="rimshade" d="' + face + '" stroke-width="' + r1(0.16 * M) + '" filter="url(#tube-wide)"/></g>';
        // the dark tube corners / bezel outside the face
        tHtml += '<path class="bezel" fill-rule="evenodd" filter="url(#tube-soft)" d="M' + -E + " " + -E + " H" + (W + E) + " V" + (H + E) + " H" + -E + " Z " + face + '"/>';
        tube.innerHTML = tHtml;

        // ---------------------------------------------------------------- the roll (pure function of time, in periods)
        var T0 = 1.2, T1 = 3.6, T2 = 4.2;
        var V0 = 0.8, VP = 1.4, V1 = 0.2; // rolls per second: static-phase hum, picture arrival, end of the slow-down
        var DEF = 0.08; // the hold catches with the picture 8% of a period short of lock
        var NX = 1.526; // slow-down shape exponent (chosen so the hum starts in the top quarter)
        var ZETA = 0.4, WN = 11; // lock: one small overshoot, settled by ~4.1 s
        var NLOCK = 3;
        var DA = V0 * T0 + ((VP - V0) * T0) / 3;
        var DB = (T1 - T0) * (V1 + (VP - V1) / (NX + 1));
        var O0 = NLOCK - DEF - DA - DB;
        var WD = WN * Math.sqrt(1 - ZETA * ZETA);
        var SPC = (-V1 + ZETA * WN * DEF) / WD;
        function spring(tau) {
          var e = Math.exp(-ZETA * WN * tau);
          var x = e * (DEF * Math.cos(WD * tau) + SPC * Math.sin(WD * tau));
          var q = Math.min(1, Math.max(0, (tau - 0.42) / 0.18));
          return x * (1 - q * q * (3 - 2 * q));
        }
        function roll(t) {
          if (t <= T0) return O0 + V0 * t + ((VP - V0) * t * t * t) / (3 * T0 * T0);
          if (t <= T1) {
            var s = (t - T0) / (T1 - T0);
            return O0 + DA + (T1 - T0) * (V1 * s + ((VP - V1) * (1 - Math.pow(1 - s, NX + 1))) / (NX + 1));
          }
          if (t < T2) return NLOCK - spring(t - T1);
          return NLOCK;
        }
        function frac(v) {
          return v - Math.floor(v);
        }

        // ---------------------------------------------------------------- timeline
        var tl = gsap.timeline({ paused: true });

        // 0-1.2 static; 1.2 the picture arrives under it; the snow thins out monotonically by 3.0
        tl.fromTo("#pic-fx", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: "none" }, T0 - 0.05);
        tl.fromTo("#static", { opacity: 1 }, { opacity: 0.3, duration: 0.28, ease: "power2.out" }, T0);
        tl.to("#static", { autoAlpha: 0, duration: 1.5, ease: "sine.inOut" }, T0 + 0.3);
        // weak signal strengthens while the hold slips (one monotonic rise)
        tl.fromTo(".sig", { opacity: 0.55 }, { opacity: 0.85, duration: 2.9, ease: "sine.in" }, T0);
        // 4.2 locked: scanlines ease off a little, the word blooms to full neon, tagline arrives
        tl.to(".sig", { opacity: 1, duration: 0.5, ease: "sine.out" }, T2);
        tl.fromTo(".wm-bloom", { opacity: 0 }, { opacity: 0.58, duration: 0.6, ease: "power2.out" }, T2);
        tl.fromTo("#pool-pink", { opacity: 0 }, { opacity: 0.2, duration: 0.7, ease: "sine.out" }, T2);
        tl.fromTo("#pool-cyan", { opacity: 0 }, { opacity: 0.3, duration: 0.7, ease: "sine.out" }, T2);
        tl.fromTo("#scan", { opacity: 1 }, { opacity: 0.6, duration: 0.9, ease: "sine.inOut" }, T2);
        tl.fromTo("#grille", { opacity: 0.2 }, { opacity: 0.14, duration: 0.9, ease: "sine.inOut" }, T2);
        tl.fromTo("#tag", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.3);

        // PROCEDURAL LAYER: one driver; every per-frame value is a pure function of time
        var turb = document.getElementById("turb");
        var vblur = document.getElementById("vblur");
        var wt1 = document.getElementById("wt1");
        var wt2 = document.getElementById("wt2");
        var wdisp = document.getElementById("wdisp");
        var picFx = document.getElementById("pic-fx");
        var film = document.getElementById("film-grain");
        var rgbEls = strip.querySelectorAll(".rgb");
        var lastSeed = -1, lastG = -1, filterOn = null;
        var SIGMA_MAX = 0.011 * H, WOB = 90 * (W / 1920), SPLIT = 0.045 * FS;
        function frame(t) {
          var f = Math.floor(t * 30 + 1e-4);
          var g = Math.floor(f / 2);
          // static: one new seed per frame while it is visible
          var seed = 1 + Math.min(f, 92);
          if (seed !== lastSeed) {
            turb.setAttribute("seed", String(seed));
            lastSeed = seed;
          }
          // film grain: noise.png offset from a seeded LCG every 2 frames
          var n = lcg(g);
          film.style.backgroundPosition = (n % 160) + "px " + ((n >>> 9) % 160) + "px";

          // roll phase -> strip position (content moves down; rest = picture exactly fills the glass)
          var o = roll(t);
          var ph = frac(o + 1e-9);
          if (o >= NLOCK - 1e-9 && o <= NLOCK + 1e-9) ph = 0;
          strip.style.transform = "translateY(" + (-B - P + ph * P).toFixed(2) + "px)";

          // hum band in the static rides the same phase, so it hands over to the blanking bar at 1.2 s
          var c = ph * P - B / 2;
          for (var i = 0; i < hums.length; i++) {
            hums[i].style.transform = "translateY(" + (c + (i - 1) * P - HB / 2).toFixed(2) + "px)";
          }

          // speed in rolls/s drives smear, tracking wobble and RGB split (all shrink as it slows)
          var v = Math.abs(roll(t + 0.004) - roll(t - 0.004)) / 0.008;
          var sf = t < T0 - 0.05 || t >= T2 ? 0 : Math.min(1, v / VP);
          if (sf > 0.004) {
            if (filterOn !== true) {
              picFx.style.filter = "url(#hold)";
              filterOn = true;
            }
            var pxpf = (v * P) / 30;
            vblur.setAttribute("stdDeviation", "0 " + Math.min(SIGMA_MAX, 0.2 * pxpf).toFixed(2));
            wdisp.setAttribute("scale", (WOB * Math.pow(sf, 0.8)).toFixed(2));
            if (g !== lastG) {
              wt1.setAttribute("seed", String(3 + g));
              wt2.setAttribute("seed", String(101 + g));
              lastG = g;
            }
          } else if (filterOn !== false) {
            picFx.style.filter = "none";
            filterOn = false;
          }
          var ax = SPLIT * sf;
          for (var j = 0; j < rgbEls.length; j++) {
            var el = rgbEls[j];
            if (ax > 0.25) {
              var dir = j % 2 === 0 ? -1 : 1;
              var jx = dir * ax * (0.75 + 0.5 * glitchHash(g * 13 + j * 7));
              var jy = (glitchHash(g * 29 + j * 11) * 2 - 1) * ax * 0.25;
              el.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";
              el.style.opacity = "0.75";
            } else {
              el.style.transform = "none";
              el.style.opacity = "0";
            }
          }
        }
        var clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          {
            t: 6,
            duration: 6,
            ease: "none",
            onUpdate: function () {
              frame(clock.t);
            },
          },
          0,
        );
        frame(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
