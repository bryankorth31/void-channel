          s.word = s.x < box.r && s.x + s.w > box.l && s.y < box.b && s.y + s.h > box.t;
          return s;
        });

        // screens (DOM)
        var sHtml = "";
        screens.forEach(function (s) {
          var X = s.x - 2, Y = s.y - 2, SW = s.w + 4, SH = s.h + 4;
          var o = '<div class="scr" id="scr-' + s.id + '" style="left:' + X + "px;top:" + Y + "px;width:" + SW + "px;height:" + SH + "px;border-radius:" + (s.rad + 2) + 'px">';
          if (!s.dead) {
            o += '<div class="tint t-' + s.tint + '"></div>';
            o += '<div class="dim" style="opacity:' + (0.45 * Math.min(1, Math.max(0, s.dist / CFG.falloff))).toFixed(3) + '"></div>';
          }
          if (s.hum) o += '<div class="hum"></div>';
          o += '<div class="off off-top"></div><div class="off off-bot"></div>';
          if (s.band) {
            o += '<div class="ghost" aria-hidden="true" data-layout-ignore><div class="plate" style="left:' + -X + "px;top:" + -Y + 'px"><div class="wm-stack">' + wm("wm-base") + "</div></div></div>";
          }
          if (!s.dead) {
            o += '<div class="sig" aria-hidden="true" data-layout-ignore><div class="pic" style="left:' + (-PAD - X) + "px;top:" + (-PAD - Y) + "px;width:" + (W + 2 * PAD) + "px;height:" + (H + 2 * PAD) + 'px">';
            o += '<div class="plate carrier" style="left:' + PAD + "px;top:" + PAD + "px;width:" + W + "px;height:" + H + 'px">';
            if (s.word) {
              o += '<div class="wm-stack">' + (s.band ? wm("rgb warm") + wm("rgb cool") : "") + wm("wm-base") + "</div>";
            }
            o += "</div></div></div>";
          }
          var ins = Math.round(0.38 * s.h);
          o += '<div class="glass" style="box-shadow:inset 0 0 ' + ins + "px var(--inset_a),inset 0 0 8px var(--inset_b);border-radius:" + (s.rad + 2) + 'px"></div>';
          o += "</div>";
          sHtml += o;
        });
        var screensEl = document.getElementById("screens");
        screensEl.innerHTML = sHtml;
        // plates inside the ghost layer are frame-sized too
        Array.prototype.forEach.call(screensEl.querySelectorAll(".ghost .plate"), function (p) {
          p.style.width = W + "px";
          p.style.height = H + "px";
        });

        // cabinets (one SVG, screen holes masked out)
        function rect(cls, x, y, w, h, rx) {
          return '<rect class="' + cls + '" x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) + '" rx="' + r1(rx) + '"/>';
        }
        function circ(cls, x, y, rr) {
          return '<circle class="' + cls + '" cx="' + r1(x) + '" cy="' + r1(y) + '" r="' + r1(rr) + '"/>';
        }
        function line(cls, x1, y1, x2, y2) {
          return '<line class="' + cls + '" x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) + '"/>';
        }
        var M = 400;
        var svg = "<defs>";
        svg += '<linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cabinet_mid)"/><stop offset="1" style="stop-color:var(--cabinet_dark)"/></linearGradient>';
        svg += '<linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cabinet_dark)"/><stop offset="1" style="stop-color:var(--knob)"/></linearGradient>';
        svg += '<mask id="holes" maskUnits="userSpaceOnUse" x="' + -M + '" y="' + -M + '" width="' + (W + 2 * M) + '" height="' + (H + 2 * M) + '">';
        svg += '<rect x="' + -M + '" y="' + -M + '" width="' + (W + 2 * M) + '" height="' + (H + 2 * M) + '" fill="white"/>';
        screens.forEach(function (s) {
          svg += '<rect x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '" rx="' + s.rad + '" fill="black"/>';
        });
        svg += "</mask></defs>";
        svg += '<g mask="url(#holes)">';
        svg += rect("gap", -M, -M, W + 2 * M, H + 2 * M, 0);
        screens.forEach(function (s) {
          var cr = s.cx + s.cw, cb = s.cy + s.ch, sr = s.x + s.w, sb = s.y + s.h, h = s.ch;
          var o = rect("cab", s.cx, s.cy, s.cw, s.ch, 10);
          o += rect("sur", s.x - 7, s.y - 7, s.w + 14, s.h + 14, s.rad + 7);
          var ledCls = s.dead ? "led-off" : "led";
          if (s.type === "console") {
            var pw = 0.27 * h, px = sr + (cr - sr - pw) / 2;
            o += rect("panel", px, s.cy + 0.1 * h, pw, 0.78 * h, 6);
            var kr = Math.min(pw * 0.3, 0.068 * h);
            [0.25, 0.43].forEach(function (f) {
              o += circ("knob", px + pw / 2, s.cy + f * h, kr);
              o += line("tick", px + pw / 2, s.cy + f * h - kr * 0.85, px + pw / 2, s.cy + f * h - kr * 0.3);
            });
            for (var k = 0; k < 5; k++) o += rect("slot", px + pw * 0.16, s.cy + (0.56 + k * 0.055) * h, pw * 0.68, 3, 1.5);
            o += circ(ledCls, px + pw / 2, s.cy + 0.83 * h, 2.6);
          } else if (s.type === "wide") {
            var cyy = sb + (cb - sb) / 2;
            for (var d = 0; d < 3; d++) o += circ("knob", cr - 30 - d * 16, cyy, 4.5);
            o += circ(ledCls, s.cx + 30, cyy, 2.6);
            o += rect("slot", s.cx + 44, cyy - 1.5, 60, 3, 1.5);
          } else {
            // portable, monitor, dead: a chin with a power LED and two buttons
            var chy = sb + (cb - sb) / 2;
            o += circ(ledCls, cr - 0.12 * s.cw, chy, 2.6);
            o += rect("btn", cr - 0.12 * s.cw - 34, chy - 3.5, 16, 7, 3);
            o += rect("btn", cr - 0.12 * s.cw - 56, chy - 3.5, 16, 7, 3);
            if (s.type === "monitor") o += rect("slot", s.cx + 0.1 * s.cw, chy - 1.5, 0.22 * s.cw, 3, 1.5);
          }
          o += '<path class="rim" d="M' + (s.cx + 0.75) + "," + (cb - 12) + " L" + (s.cx + 0.75) + "," + (s.cy + 10) + " Q" + (s.cx + 0.75) + "," + (s.cy + 0.75) + " " + (s.cx + 10) + "," + (s.cy + 0.75) + " L" + (cr - 12) + "," + (s.cy + 0.75) + '"/>';
          svg += o;
        });
        svg += "</g>";
        var cabEl = document.getElementById("cabinets");
        cabEl.setAttribute("width", W);
        cabEl.setAttribute("height", H);
        cabEl.setAttribute("viewBox", "0 0 " + W + " " + H);
        cabEl.innerHTML = svg;

        // haze blobs
        var hz = [
          [0.22, 0.3, 0.55, 0.5],
          [0.7, 0.62, 0.6, 0.55],
          [0.46, 0.9, 0.5, 0.4],
        ];
        document.getElementById("haze").innerHTML = hz
          .map(function (b) {
            var bw = b[2] * Math.max(W, H), bh = b[3] * Math.max(W, H);
            return '<div class="blob" style="left:' + r1(b[0] * W - bw / 2) + "px;top:" + r1(b[1] * H - bh / 2) + "px;width:" + r1(bw) + "px;height:" + r1(bh) + 'px"></div>';
          })
          .join("");

        // free wordmark: ghosts, bloom, core share one grid cell
        document.getElementById("wm-stack").innerHTML = wm("rgb warm") + wm("rgb cool") + wm("wm-bloom") + wm("wm-core");
        // the vignette is transparent over the word (50% stop); its covering the core is intentional layering
        document.querySelectorAll("#wm .wm-core b, #wm .wm-core i").forEach(function (el) {
          el.setAttribute("data-layout-allow-occlusion", "true");
        });

        // spill pools sized from the arrival word width (cam space)
        var arrW = inkW * 1.3;
        var wl = CX - arrW / 2;
        [["pool-pink", 0.315], ["pool-cyan", 0.815]].forEach(function (p) {
          var el = document.getElementById(p[0]);
          var pw = 0.7 * arrW, ph = 0.45 * arrW;
          el.style.left = r1(wl + p[1] * arrW - pw / 2) + "px";
          el.style.top = r1(CY - ph / 2) + "px";
          el.style.width = r1(pw) + "px";
          el.style.height = r1(ph) + "px";
        });

        // ---------------------------------------------------------------- timeline
        var tl = gsap.timeline({ paused: true });
        var lit = screens.filter(function (s) {
          return !s.dead;
        });
        lit.forEach(function (s) {
          var el = document.getElementById("scr-" + s.id);
          s.el = el;
          s.offs = el.querySelectorAll(".off");
          s.sig = el.querySelector(".sig");
          s.pic = el.querySelector(".pic");
          s.ghost = el.querySelector(".ghost");
          s.humEl = el.querySelector(".hum");
          s.rgb = el.querySelectorAll(".pic .rgb");
        });

        // camera: one continuous push (the film's current); haze drift
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.045, duration: 7, ease: "none" }, 0);
        tl.fromTo("#haze", { x: 0 }, { x: 60, duration: 7, ease: "none" }, 0);

        // POWER-ON CASCADE 0.04-0.52: nearest the word first, accelerating
        var byDist = lit.slice().sort(function (a, b) {
          return a.dist - b.dist;
        });
        byDist.forEach(function (s, k) {
          var u = k / (byDist.length - 1);
          var at = 0.04 + 0.32 * (1 - Math.pow(1 - u, 1.6));
          tl.fromTo(s.offs, { scaleY: 1 }, { scaleY: 0, duration: 0.16, ease: "power2.out" }, at);
        });

        // SIGNAL HUNTING 1.55-2.2: band screens catch a ghost of the word
        var band = lit.filter(function (s) {
          return s.band;
        });
        band.forEach(function (s) {
          tl.fromTo(s.ghost, { opacity: 0 }, { opacity: 0.16, duration: 0.65, ease: "sine.in" }, 1.55);
        });

        // LOCK WAVE 2.20-3.15: the single static-to-signal transition, in waveRank order
        lit.forEach(function (s) {
          var c = s.mx / 160;
          s.rank = c + s.shelf * 0.35 + Math.sin(s.shelf * 1.7 + c * 0.42) * 1.1;
        });
        var byRank = lit.slice().sort(function (a, b) {
          return a.rank - b.rank;
        });
        byRank.forEach(function (s, k) {
          var at = 2.2 + (k * 0.61) / (byRank.length - 1);
          s.lock = at;
          tl.fromTo(s.sig, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.22, ease: "power2.out" }, at);
          tl.fromTo(s.pic, { y: r1(0.14 * s.h) }, { y: 0, duration: 0.34, ease: "power3.out" }, at);
        });
        // the static plane is fully covered by 3.3 s
        tl.set("#static", { autoAlpha: 0 }, 3.3);

        // EMERGENCE 3.30-4.45: the sign pulls free of the glass
        tl.fromTo("#wm", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.18, ease: "power1.out" }, 3.3);
        tl.fromTo("#wm", { scale: 1, y: 0 }, { scale: 1.29, y: CFG.lift, duration: 1.15, ease: "expo.inOut" }, 3.3);
        tl.fromTo("#wall", { "--dof": "0px", "--wb": 1 }, { "--dof": "3.5px", "--wb": 0.62, duration: 1.05, ease: "sine.inOut" }, 3.4);
        tl.fromTo(".pic .wm-stack", { opacity: 1 }, { opacity: 0.4, duration: 1.1, ease: "power1.inOut" }, 3.35);
        tl.fromTo("#pool-pink", { opacity: 0 }, { opacity: CFG.spillPink, duration: 1.1, ease: "sine.out" }, 3.5);
        tl.fromTo("#pool-cyan", { opacity: 0 }, { opacity: 0.32, duration: 1.1, ease: "sine.out" }, 3.5);
        tl.fromTo("#wm .wm-bloom", { opacity: 0 }, { opacity: 0.85, duration: 0.55, ease: "power2.in" }, 3.9);

        // HOLD / LOCKUP 4.45-7.0: sustained travel, one gentle settle, nothing pulses
        tl.to("#wm", { scale: 1.32, duration: 2.55, ease: "none" }, 4.45);
        tl.to("#wm .wm-bloom", { opacity: CFG.bloomHold, duration: 0.95, ease: "sine.out" }, 4.45);
        tl.to(".pic .wm-stack", { opacity: 0.2, duration: 1.75, ease: "sine.out" }, 4.45);

        // PROCEDURAL LAYER: one driver; every per-frame value is a pure function of time
        var turb = document.getElementById("turb");
        var film = document.getElementById("film-grain");
        var wmRgb = document.querySelectorAll("#wm .rgb");
        var p3in = gsap.parseEase("power3.in");
        var lastSeed = -1;
        function setRgb(els, amp, f, salt, maxSplit, alpha) {
          for (var layer = 0; layer < els.length; layer++) {
            var el = els[layer];
            if (amp > 0.0005) {
              var jx = (glitchHash(f * 13 + layer * 7 + salt) * 2 - 1) * maxSplit * amp;
              var jy = (glitchHash(f * 29 + layer * 11 + salt) * 2 - 1) * maxSplit * 0.35 * amp;
              el.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";
              el.style.opacity = String(alpha);
            } else {
              el.style.transform = "none";
              el.style.opacity = "0";
            }
          }
        }
        function frame(t) {
          var f = Math.floor(t * 30 + 1e-4); // frame index
          var g = Math.floor(f / 2); // 2-frame step
          // static: one new seed per frame until it is hidden
          var seed = 1 + Math.min(f, 102);
          if (seed !== lastSeed) {
            turb.setAttribute("seed", String(seed));
            lastSeed = seed;
          }
          // film grain: noise.png offset from a seeded LCG every 2 frames
          var n = lcg(g);
          film.style.backgroundPosition = (n % 160) + "px " + ((n >>> 9) % 160) + "px";
          // hum bars: 22% band rolling top->bottom, 1.5 s period, 0.5-3.2 s
          lit.forEach(function (s) {
            if (!s.humEl) return;
            if (t >= 0.5 && t <= 3.2) {
              var ph = ((t - 0.5) / 1.5) % 1;
              s.humEl.style.opacity = "1";
              s.humEl.style.transform = "translateY(" + ((-0.22 + ph * 1.22) * (s.h + 4)).toFixed(2) + "px)";
            } else {
              s.humEl.style.opacity = "0";
            }
          });
          band.forEach(function (s, j) {
            // signal hunting jitter (quantized every 2 frames), amp 1 -> 0.4, held until the lock covers it
            var hx = 0;
            if (t >= 1.55 && t < s.lock + 0.22) {
              var amp = t < 2.2 ? 1 - 0.6 * ((t - 1.55) / 0.65) : 0.4;
              hx = amp * (glitchHash(g * 13 + s.idx * 7) * 2 - 1) * 14;
            }
            s.ghost.style.transform = "translateX(" + hx.toFixed(2) + "px)";
            // RGB split during the lock: amp 1 -> 0 over 0.34 s, max 4 px
            var lu = (t - s.lock) / 0.34;
            var la = lu >= 0 && lu < 1 ? 1 - p3in(lu) : 0;
            setRgb(s.rgb, la, f, j * 31, 4, 0.75);
          });
          // the free word at lift-off: amp 0.6 -> 0 over 3.30-3.70
          var wu = (t - 3.3) / 0.4;
          var wa = wu >= 0 && wu < 1 ? 0.6 * (1 - p3in(wu)) : 0;
          setRgb(wmRgb, wa, f, 97, 12, 0.8);
        }
        var clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          {
            t: 7,
            duration: 7,
            ease: "none",
            onUpdate: function () {
              frame(clock.t);
            },
          },
          0,
        );
        frame(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
