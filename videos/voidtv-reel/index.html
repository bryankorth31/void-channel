<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VOIDtv reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07080c; }
      .clip { position: absolute; inset: 0; }
      /* every scene is a still with room to move: oversized, then pushed or pulled by the timeline */
      .sc { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; object-fit: cover; display: block; opacity: 0; }
      #logo-scene { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, #0d1118 0%, #07080c 70%); }
      #mark { position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px; display: block; filter: drop-shadow(0 0 28px rgba(95,212,255,.35)); }
      #mark-glow { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, rgba(63,207,90,.22) 0%, rgba(95,212,255,.16) 30%, rgba(0,0,0,0) 62%); }
      #banner-scene { position: absolute; inset: 0; opacity: 0; background: #07080c; }
      #banner { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; object-fit: cover; display: block; }
      #snow { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      #grain { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #b7bcc8; filter: url(#static) contrast(1.9) brightness(1.02); transform: scale(4); transform-origin: 0 0; image-rendering: pixelated; }
      #band { position: absolute; left: 0; right: 0; top: 40%; height: 7%; background: rgba(255,255,255,.18); box-shadow: 0 0 40px rgba(95,212,255,.35); opacity: 0; }
      #film { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.14) 3px 4px); opacity: .5; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(7,8,12,0) 48%, rgba(7,8,12,.75) 100%); }
      #svgdefs { position: absolute; width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <svg id="svgdefs" aria-hidden="true">
        <filter id="static" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.95 0.55" numOctaves="1" seed="1" stitchTiles="stitch" result="n" />
          <feColorMatrix type="saturate" values="0" in="n" result="g" />
          <feComponentTransfer in="g"><feFuncR type="discrete" tableValues="0 0.04 0.18 0.62 0.92 1" /><feFuncG type="discrete" tableValues="0 0.05 0.19 0.64 0.93 1" /><feFuncB type="discrete" tableValues="0.02 0.08 0.22 0.68 0.96 1" /></feComponentTransfer>
        </filter>
      </svg>
      <section id="stage" class="clip" data-start="0" data-duration="40" data-track-index="0">
        <img class="sc" id="s1" src="assets/static-dark.jpg" alt="" />
        <img class="sc" id="s2" src="assets/sign-pink.jpg" alt="" />
        <img class="sc" id="s3" src="assets/static-bolt.jpg" alt="" />
        <img class="sc" id="s4" src="assets/wall.jpg" alt="" />
        <img class="sc" id="s5" src="assets/watcher-purple.jpg" alt="" />
        <img class="sc" id="s6" src="assets/static-glitch.jpg" alt="" />
        <div id="logo-scene"><div id="mark-glow"></div><img id="mark" src="assets/mark-master.png" alt="" /></div>
        <img class="sc" id="s7" src="assets/sign-orange.jpg" alt="" />
        <img class="sc" id="s8" src="assets/watcher-orange.jpg" alt="" />
        <div id="banner-scene"><img id="banner" src="assets/banner.jpg" alt="" /></div>
        <img class="sc" id="s9" src="assets/static-dark.jpg" alt="" />
        <div id="snow"><div id="grain"></div></div>
        <div id="band"></div>
        <div id="film"></div>
        <div id="vig"></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("turb");
      const seed = { v: 1 };
      tl.to(seed, { v: 1200, duration: 40, ease: "none", snap: { v: 1 }, onUpdate: () => turb.setAttribute("seed", String(seed.v)) }, 0);

      // a channel-change: 5 frames of snow with a scan band, between every scene
      function blip(t) {
        tl.set("#snow", { opacity: 1 }, t); tl.set("#snow", { opacity: 0 }, t + 0.17);
        tl.fromTo("#band", { opacity: 1, y: -400 }, { opacity: 0, y: 500, duration: 0.17, ease: "none", immediateRender: false }, t);
      }
      // a scene: a still, pushed or pulled slowly, with a drift
      function scene(id, t0, t1, from, to) {
        tl.set(id, { opacity: 1 }, t0);
        tl.fromTo(id, from, { ...to, duration: t1 - t0, ease: "none", immediateRender: false }, t0);
        tl.set(id, { opacity: 0 }, t1);
      }
      // scene list: [id, start, end, from, to]  — zooms alternate in/out, drifts alternate direction
      const cues = [
        ["#s1", 0.0, 4.2, { scale: 1.02, x: 0, y: 0 }, { scale: 1.12, x: -30, y: -10 }],
        ["#s2", 4.2, 8.6, { scale: 1.18, x: 40, y: 20 }, { scale: 1.04, x: 0, y: 0 }],
        ["#s3", 8.6, 11.4, { scale: 1.05, x: -60, y: 0 }, { scale: 1.1, x: 60, y: 10 }],
        ["#s4", 11.4, 16.6, { scale: 1.0, x: 0, y: 0 }, { scale: 1.14, x: 0, y: -20 }],
        ["#s5", 16.6, 20.8, { scale: 1.16, x: -20, y: 30 }, { scale: 1.02, x: 10, y: 0 }],
        ["#s6", 20.8, 23.4, { scale: 1.04, x: 50, y: -20 }, { scale: 1.12, x: -40, y: 20 }],
        ["#s7", 27.4, 31.4, { scale: 1.02, x: 0, y: 0 }, { scale: 1.14, x: -40, y: -20 }],
        ["#s8", 31.4, 35.2, { scale: 1.14, x: 30, y: 0 }, { scale: 1.02, x: 0, y: 20 }],
        ["#s9", 37.6, 40.0, { scale: 1.02, x: 0, y: 0 }, { scale: 1.08, x: 20, y: 0 }],
      ];
      for (const [id, a, b, f, t] of cues) { scene(id, a, b, f, t); blip(b - 0.08); }
      blip(0.0);

      // the logo beat at 23.4-27.4: the void arrives through snow, settles, breathes, cuts away
      tl.set("#logo-scene", { opacity: 1 }, 23.4); tl.set("#logo-scene", { opacity: 0 }, 27.4);
      tl.fromTo("#mark", { scale: 1.3, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 23.45);
      tl.to("#mark", { scale: 1.06, duration: 3.2, ease: "sine.inOut" }, 24.15);
      tl.fromTo("#mark-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1.4, ease: "sine.out", immediateRender: false }, 23.5);

      // the banner beat at 35.2-37.6: the swirl banner pushed through, fast and wide
      tl.set("#banner-scene", { opacity: 1 }, 35.2); tl.set("#banner-scene", { opacity: 0 }, 37.6);
      tl.fromTo("#banner", { scale: 1.7, x: 140, rotation: 2 }, { scale: 1.3, x: -140, rotation: -2, duration: 2.4, ease: "none", immediateRender: false }, 35.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
