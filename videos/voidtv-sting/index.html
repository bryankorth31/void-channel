<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VOIDtv sting</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07080c; }
      .clip { position: absolute; inset: 0; }
      #stage { display: flex; align-items: center; justify-content: center; }
      /* analog static: an SVG turbulence filter whose seed the timeline steps through, so it is seek-safe */
      #noise { position: absolute; inset: 0; overflow: hidden; opacity: 1; }
      #grain { position: absolute; left: 0; top: 0; width: 480px; height: 270px; background: #b7bcc8; filter: url(#static) contrast(1.9) brightness(1.05); transform: scale(4); transform-origin: 0 0; image-rendering: pixelated; }
      #noise-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(95,212,255,.10), rgba(0,0,0,0) 45%, rgba(242,169,59,.06)); mix-blend-mode: screen; }
      #glow { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
              background: radial-gradient(circle, rgba(95,212,255,.42) 0%, rgba(95,212,255,.14) 28%, rgba(7,8,12,0) 62%); opacity: 0; }
      #mark { position: relative; width: 600px; height: 600px; }
      #mark img { position: absolute; left: 0; top: 0; width: 600px; height: 600px; display: block; }
      #swirl { opacity: 0; filter: drop-shadow(0 0 22px rgba(95,212,255,.35)); }
      #letters { opacity: 0; }
      #bloom { position: absolute; left: 0; top: 0; width: 600px; height: 600px; background: url(assets/letters.png) center/600px 600px no-repeat; opacity: 0; filter: blur(18px) saturate(1.6) brightness(1.4); }
      #flash { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, rgba(232,246,255,.9) 0%, rgba(232,246,255,.25) 35%, rgba(232,246,255,0) 70%); opacity: 0; mix-blend-mode: screen; }
      #scanlines { position: absolute; inset: 0; opacity: 0; pointer-events: none;
                   background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,.55) 3px, rgba(0,0,0,.55) 4px); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(7,8,12,0) 45%, rgba(7,8,12,.82) 100%); }
      #svgdefs { position: absolute; width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <svg id="svgdefs" aria-hidden="true">
        <filter id="static" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.95 0.55" numOctaves="1" seed="1" stitchTiles="stitch" result="n" />
          <feColorMatrix type="saturate" values="0" in="n" result="g" />
          <feComponentTransfer in="g">
            <feFuncR type="discrete" tableValues="0 0.04 0.18 0.62 0.92 1" />
            <feFuncG type="discrete" tableValues="0 0.05 0.19 0.64 0.93 1" />
            <feFuncB type="discrete" tableValues="0.02 0.08 0.22 0.68 0.96 1" />
          </feComponentTransfer>
        </filter>
      </svg>
      <section id="stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="glow"></div>
        <div id="mark">
          <img id="swirl" src="assets/swirl.png" alt="" />
          <div id="bloom"></div>
          <img id="letters" src="assets/letters.png" alt="" />
        </div>
        <div id="noise"><div id="grain"></div></div>
        <div id="noise-tint"></div>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        <div id="flash"></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("turb");
      const seed = { v: 1 };

      // 0.0-1.1  static, seed stepping every frame (deterministic per time), glow breathing in behind it
      tl.to(seed, { v: 48, duration: 1.4, ease: "none", snap: { v: 1 }, onUpdate: () => turb.setAttribute("seed", String(seed.v)) }, 0);
      tl.fromTo("#glow", { opacity: 0, scale: 0.8 }, { opacity: 0.55, scale: 1, duration: 1.1, ease: "sine.inOut" }, 0);

      // 1.1-1.4  signal: the static collapses to a scan band and dies; swirl is already there, turning
      tl.to("#noise", { scaleY: 0.035, duration: 0.22, ease: "power4.in" }, 1.1);
      tl.to("#noise", { opacity: 0, duration: 0.12, ease: "none" }, 1.3);
      tl.to("#noise-tint", { opacity: 0, duration: 0.3 }, 1.1);
      tl.fromTo("#swirl", { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.12);
      tl.fromTo("#swirl", { rotation: 0 }, { rotation: 46, duration: 4, ease: "none" }, 0);
      tl.to("#glow", { opacity: 0.32, scale: 1.12, duration: 1.2, ease: "sine.out" }, 1.3);
      tl.to("#scanlines", { opacity: 0.16, duration: 0.3 }, 1.25);

      // 1.55-2.3  the V and T settle, still, on top of the turning void; gold-cyan bloom then cool
      tl.fromTo("#letters", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 1.55);
      tl.fromTo("#bloom", { opacity: 0, scale: 1.1 }, { opacity: 0.9, scale: 1.02, duration: 0.3, ease: "power2.out" }, 1.6);
      tl.to("#bloom", { opacity: 0.28, scale: 1, duration: 0.8, ease: "sine.out" }, 1.92);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.05, ease: "none" }, 2.05);
      tl.to("#flash", { opacity: 0, duration: 0.25, ease: "power2.out" }, 2.1);

      // 2.3-4.0  hold; the void keeps turning
      tl.to("#glow", { opacity: 0.26, duration: 1.5, ease: "sine.inOut" }, 2.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
