        svg += "</mask></defs>";

          svg += circ("knob", tx, ty, 0.009 * SW);
        });
        svg += '<path class="dome" d="M' + r1(SCX - domeRx) + "," + r1(cabY + 2) + " A" + r1(domeRx) + " " + r1(domeRy) + " 0 0 1 " + r1(SCX + domeRx) + "," + r1(cabY + 2) + ' Z"/>';
        // feet
        svg += rect("foot", cabX + 0.12 * cabW, cabY + cabH - 6, 0.12 * cabW, footH + 6, 4);
        svg += rect("foot", cabX + 0.76 * cabW, cabY + cabH - 6, 0.12 * cabW, footH + 6, 4);
        // the cabinet, its bezel ring and the control chin (screen hole masked out)
        svg += '<g mask="url(#hole)">';
        svg += rect("cab", cabX, cabY, cabW, cabH, cabR);
        var bez = 0.026 * SW;
        svg += rect("sur", SX - bez, SY - bez, SW + 2 * bez, SH + 2 * bez, RAD + bez);
        var pTop = SY + SH + bez + 0.035 * SH, pBot = cabY + cabH - 0.045 * SH;
        var pH = pBot - pTop, pMid = (pTop + pBot) / 2;
        svg += rect("panel", cabX + 0.05 * cabW, pTop, 0.9 * cabW, pH, 8);
        // speaker grille
        var nSlots = 6;
        for (var k = 0; k < nSlots; k++) {
          svg += rect("slot", cabX + 0.09 * cabW, pTop + pH * (0.2 + (k * 0.6) / (nSlots - 1)) - 0.006 * SH, 0.38 * cabW, 0.012 * SH, 0.006 * SH);
        }
        // power LED
        var ledR = Math.max(2.6, 0.006 * SW);
        svg += circ("led-off", cabX + 0.575 * cabW, pMid, ledR);
        svg += circ("led", cabX + 0.575 * cabW, pMid, ledR, "led");
        // channel dial: 12 detents and a pointer that clicks round on each change
        var dX = cabX + 0.7 * cabW, dR = 0.27 * pH;
        for (var j = 0; j < 12; j++) {
          var a = (j / 12) * Math.PI * 2;
          svg += line("tick", dX + Math.sin(a) * dR * 1.22, pMid - Math.cos(a) * dR * 1.22, dX + Math.sin(a) * dR * 1.36, pMid - Math.cos(a) * dR * 1.36, 1.5);
        }
        svg += circ("knob", dX, pMid, dR);
        svg += circ("ring", dX, pMid, dR * 0.72);
        svg += '<g id="dial-ptr">' + line("tick", dX, pMid - dR * 0.3, dX, pMid - dR * 0.86, 2.5) + "</g>";
        // volume knob
        var vX = cabX + 0.86 * cabW, vR = 0.19 * pH;
        svg += circ("knob", vX, pMid, vR);
        svg += line("tick", vX, pMid - vR * 0.3, vX + vR * 0.5, pMid - vR * 0.74, 2);
        // violet rim on the top and left edges
        var cr = cabX + cabW, cb = cabY + cabH;
        svg += '<path class="rim" d="M' + r1(cabX + 0.75) + "," + r1(cb - cabR) + " L" + r1(cabX + 0.75) + "," + r1(cabY + cabR) + " Q" + r1(cabX + 0.75) + "," + r1(cabY + 0.75) + " " + r1(cabX + cabR) + "," + r1(cabY + 0.75) + " L" + r1(cr - cabR) + "," + r1(cabY + 0.75) + '"/>';
        svg += "</g>";
        var tvEl = document.getElementById("tv");
        tvEl.setAttribute("width", W);
        tvEl.setAttribute("height", H);
        tvEl.setAttribute("viewBox", "0 0 " + W + " " + H);
        tvEl.innerHTML = svg;

        // haze blobs (constant opacity, slow drift)
        var hz = [
          [0.28, 0.32, 0.5, 0.42],
          [0.72, 0.5, 0.55, 0.45],
          [0.5, 0.82, 0.62, 0.3],
        ];
        document.getElementById("haze").innerHTML = hz
          .map(function (b) {
            var bw = b[2] * Math.max(W, H), bh = b[3] * Math.max(W, H);
            return '<div class="blob" style="left:' + px(b[0] * W - bw / 2) + ";top:" + px(b[1] * H - bh / 2) + ";width:" + px(bw) + ";height:" + px(bh) + '"></div>';
          })
          .join("");

        // room light: halo in the haze, floor pool, wet-floor streaks (static colour, then the picture's)
        var room = "";
        room += div("lt lt-s glow-s", null, SCX - 1.4 * SW, SCY - 1.2 * SH, 2.8 * SW, 2.4 * SH, 0.2);
        room += div("lt lt-p glow-p", null, SCX - 1.3 * SW, SCY - 1.1 * SH, 2.6 * SW, 2.2 * SH, 0.16);
        room += div("lt lt-s pool-s", null, SCX - 1.0 * cabW, floorY - 0.13 * SH, 2.0 * cabW, 0.36 * SH, 0.24);
        room += div("lt lt-p pool-pk", null, SCX - 0.22 * SW - 0.55 * cabW, floorY - 0.11 * SH, 1.1 * cabW, 0.3 * SH, 0.2);
        room += div("lt lt-p pool-cy", null, SCX + 0.3 * SW - 0.45 * cabW, floorY - 0.11 * SH, 0.9 * cabW, 0.3 * SH, 0.18);
        var sb = "filter:blur(" + r1(0.035 * SH) + "px)";
        room += div("lt lt-s streak-s", null, SCX - 0.35 * SW, floorY + 4, 0.7 * SW, 0.6 * SH, 0.13, sb);
        room += div("lt lt-p streak-pk", null, SCX - 0.135 * inkW - 0.28 * inkW, floorY + 4, 0.56 * inkW, 0.6 * SH, 0.2, sb);
        room += div("lt lt-p streak-cy", null, SCX + 0.37 * inkW - 0.12 * inkW, floorY + 4, 0.24 * inkW, 0.6 * SH, 0.2, sb);
        room += '<div id="contact" style="left:' + px(SCX - 0.55 * cabW) + ";top:" + px(floorY - 0.04 * SH) + ";width:" + px(1.1 * cabW) + ";height:" + px(0.08 * SH) + '"></div>';
        document.getElementById("room").innerHTML = room;

        // the screen's light on the cabinet face
        var cg = function (inner) {
          return "background:radial-gradient(ellipse " + px(0.72 * cabW) + " " + px(0.66 * cabH) + " at " + px(SCX - cabX) + " " + px(SCY - cabY) + "," + inner + ");border-radius:" + px(cabR);
        };
        document.getElementById("cabspill").innerHTML =
          div("lt lt-s cspill", null, cabX, cabY, cabW, cabH, 0.46, cg("var(--light_static) 0%,var(--none) 100%")) +
          div("lt lt-p cspill", null, cabX, cabY, cabW, cabH, 0.36, cg("var(--light_pic) 0%,var(--none) 100%"));

        // screen
        var scrEl = document.getElementById("screen");
        box(scrEl, SX - 2, SY - 2, SW + 4, SH + 4);
        scrEl.style.borderRadius = px(RAD + 2);
        var SWW = SW + 4, SHH = SH + 4;
        var gw = Math.ceil(SWW / 3) + 2, gh = Math.ceil(SHH / 3) + 2;
        var grainEl = document.getElementById("grain");
        grainEl.style.width = gw + "px";
        grainEl.style.height = gh + "px";
        var tearOver = 0.15 * SW;
        var sgEl = document.getElementById("streakgrain");
        sgEl.style.left = px(-tearOver);
        sgEl.style.width = Math.ceil((SWW + 2 * tearOver) / 3) + 2 + "px";
        sgEl.style.height = Math.ceil((0.3 * SHH) / 3) + 2 + "px";
        var beamEl = document.getElementById("beam");
        beamEl.style.top = px(SHH / 2 - 2);
        var PADX = 0.25 * SW, PADY = 0.7 * SH;
        var picEl = document.getElementById("pic");
        box(picEl, -PADX, -PADY, SWW + 2 * PADX, SHH + 2 * PADY);
        var osdEl = document.getElementById("osd");
        osdEl.style.top = px(0.085 * SH);
        osdEl.style.right = px(0.085 * SW);
        osdEl.style.fontSize = px(CFG.osd * SH);
        var glassEl = document.getElementById("glass");
        glassEl.style.boxShadow = "inset 0 0 " + Math.round(0.38 * SH) + "px var(--inset_a),inset 0 0 8px var(--inset_b)";
        glassEl.style.borderRadius = px(RAD + 2);

        // the wordmark: ghosts, bloom, core share one grid cell; neon pools behind it
        var WM_INNER = '<b class="wm-a">voidtv</b><i class="wm-b">.net</i>';
        function wm(cls) {
          var hidden = cls.indexOf("core") < 0;
          return '<span class="wm ' + cls + '"' + (hidden ? ' aria-hidden="true" data-layout-ignore' : "") + ">" + WM_INNER + "</span>";
        }
        document.getElementById("wm-stack").innerHTML = wm("rgb warm") + wm("rgb cool") + wm("wm-bloom") + wm("wm-core");
        // the vignette is transparent over the word (50% stop); its covering the core is intentional layering
        document.querySelectorAll("#wm-stack .wm-core b, #wm-stack .wm-core i").forEach(function (el) {
          el.setAttribute("data-layout-allow-occlusion", "true");
        });
        var arrW = inkW * 1.3;
        var pcx = (SWW + 2 * PADX) / 2, pcy = (SHH + 2 * PADY) / 2;
        [["npool-pink", 0.315], ["npool-cyan", 0.815]].forEach(function (p) {
          var el = document.getElementById(p[0]);
          var pw = 0.7 * arrW, ph = 0.45 * arrW;
          box(el, pcx - arrW / 2 + p[1] * arrW - pw / 2, pcy - ph / 2, pw, ph);
        });

        // ---------------------------------------------------------------- timeline
        var tl = gsap.timeline({ paused: true });
        function lights(sel, a, b, dur, ease, at, later) {
          document.querySelectorAll(sel).forEach(function (el) {
            var pk = Number(el.dataset.peak);
            var to = { opacity: r1(b * pk * 1000) / 1000, duration: dur, ease: ease };
            if (later) to.immediateRender = false;
            tl.fromTo(el, { opacity: r1(a * pk * 1000) / 1000 }, to, at);
          });
        }
        tl.fromTo("#haze", { x: 0 }, { x: 40, duration: DUR, ease: "none" }, 0);

        // POWER ON 0.03-0.62: LED, a dot stretches to a glowing line, the line opens to a full raster.
        // One monotonic brightening: the raster's area only grows; the line is never brighter than the static.
        tl.fromTo("#led", { opacity: 0 }, { opacity: 0.8, duration: 0.08, ease: "power1.out" }, 0.03);
        tl.fromTo("#raster", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "none" }, T_ON);
        tl.fromTo("#raster", { scaleX: 0.03 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, T_ON);
        tl.fromTo("#raster", { scaleY: 0.008 }, { scaleY: 1, duration: 0.42, ease: "power2.inOut" }, T_OPEN);
        tl.fromTo("#beam", { scaleX: 0.03, opacity: 0 }, { scaleX: 1, opacity: 0.85, duration: 0.16, ease: "power2.out" }, T_ON);
        tl.fromTo("#beam", { opacity: 0.85 }, { opacity: 0, duration: 0.34, ease: "power1.inOut", immediateRender: false }, 0.3);
        lights(".lt-s", 0, 0.1, 0.15, "power1.in", T_ON, false);
        lights(".lt-s", 0.1, 1, 0.42, "power2.inOut", T_OPEN, true);

        // STATIC 0.6-3.0: OSD up; the number, tear, hum roll and dial are driven by frame()
        tl.fromTo("#osd", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "none" }, T_OSD);

        // SIGNAL HUNTING 2.05-3.0 on CH 04: a faint rolling ghost of the picture
        tl.fromTo("#pic", { opacity: 0 }, { opacity: 0.3, duration: 0.9, ease: "sine.in" }, T_HUNT);

        // LOCK 3.0-3.4: one monotonic darkening, static -> picture
        tl.fromTo("#raster", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, T_LOCK);
        tl.fromTo("#pic", { opacity: 0.3 }, { opacity: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, T_LOCK);
        lights(".lt-s", 1, 0, 0.3, "power1.in", T_LOCK, true);
        lights(".lt-p", 0, 1, 0.45, "power2.out", T_LOCK + 0.02, false);
        tl.fromTo("#wm-stack .wm-bloom", { opacity: 0 }, { opacity: 0.4, duration: 0.4, ease: "sine.out" }, T_LOCK + 0.05);
        tl.fromTo("#osd", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, 3.45);

        // PUSH THROUGH 3.8-4.75 (camera in frame()): scanlines and bulge fade, the neon cleans up and blooms
        tl.fromTo("#glass", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 3.95);
        tl.fromTo("#wm-stack .wm-core", { filter: "blur(0.6px)" }, { filter: "blur(0px)", duration: 0.55, ease: "sine.inOut" }, 3.95);
        tl.fromTo("#npool-pink", { opacity: 0 }, { opacity: CFG.poolPink, duration: 0.9, ease: "sine.out" }, 3.9);
        tl.fromTo("#npool-cyan", { opacity: 0 }, { opacity: 0.26, duration: 0.9, ease: "sine.out" }, 3.9);
        tl.fromTo("#wm-stack .wm-bloom", { opacity: 0.4 }, { opacity: 0.85, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 4.15);

        // HOLD 4.75-6.0: one gentle partial bloom settle, a slow creep, nothing pulses
        tl.fromTo("#wm-stack .wm-bloom", { opacity: 0.85 }, { opacity: CFG.bloomHold, duration: 1.0, ease: "sine.inOut", immediateRender: false }, P1);

        // ---------------------------------------------------------------- procedural layer
        // One driver; every per-frame value is a pure function of time.
        var turb = document.getElementById("turb");
        var turb2 = document.getElementById("turb2");
        var film = document.getElementById("film-grain");
        var camEl = document.getElementById("cam");
        var wrapEl = document.getElementById("wmwrap");
        var humEl = document.getElementById("hum");
        var tearEl = document.getElementById("tear");
        var dialEl = document.getElementById("dial-ptr");
        var picRgb = document.querySelectorAll("#wm-stack .rgb");
        camEl.style.transformOrigin = px(SCX) + " " + px(SCY);
        var p2io = gsap.parseEase("power2.inOut");
        var p3in = gsap.parseEase("power3.in");
        var p3out = gsap.parseEase("power3.out");
        var lastSeed = -1, lastCh = "";
        var TEAR_Y = [0.24, 0.5];
        var JIT = 0.018 * SW;

        function setRgb(els, amp, f, salt, maxSplit, alpha) {
          for (var layer = 0; layer < els.length; layer++) {
            var el = els[layer];
            if (amp > 0.0005) {
              var jx = (glitchHash(f * 13 + layer * 7 + salt) * 2 - 1) * maxSplit * amp;
              var jy = (glitchHash(f * 29 + layer * 11 + salt) * 2 - 1) * maxSplit * 0.35 * amp;
              el.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";
              el.style.opacity = String(alpha);
            } else {
              el.style.transform = "none";
              el.style.opacity = "0";
            }
          }
        }

        function frame(t) {
          var f = Math.floor(t * 30 + 1e-4); // frame index
          var g = Math.floor(f / 2); // 2-frame step

          // static: one new seed per frame while it is on screen (fine 3px cells, constant mean)
          var seed = 1 + Math.min(f, 100);
          if (seed !== lastSeed) {
            turb.setAttribute("seed", String(seed));
            turb2.setAttribute("seed", String(seed + 500));
            lastSeed = seed;
          }
          // film grain: noise.png offset from a seeded LCG every 2 frames
          var n = lcg(g);
          film.style.backgroundPosition = (n % 160) + "px " + ((n >>> 9) % 160) + "px";

          // channel slips: hum bar rolls top->bottom, a band tears into sync streaks
          var humY = null, tear = null;
          for (var j = 0; j < SLIPS.length; j++) {
            var tc = SLIPS[j];
            var u = (t - (tc - 0.15)) / 0.5;
            if (u >= 0 && u < 1) humY = (-0.32 + 1.32 * u) * SHH;
            var v = (t - (tc - 0.06)) / 0.3;
            if (v >= 0 && v < 1) {
              tear = {
                y: (TEAR_Y[j] + 0.22 * v) * SHH,
                h: (0.2 - 0.08 * v) * SHH,
                x: (glitchHash(f * 7 + j * 13) * 2 - 1) * 0.05 * SW + 0.07 * SW * (1 - v),
              };
            }
          }
          if (humY !== null) {
            humEl.style.opacity = "1";
            humEl.style.transform = "translateY(" + humY.toFixed(1) + "px)";
          } else {
            humEl.style.opacity = "0";
          }
          if (tear) {
            tearEl.style.opacity = "1";
            tearEl.style.top = tear.y.toFixed(1) + "px";
            tearEl.style.height = tear.h.toFixed(1) + "px";
            tearEl.style.transform = "translateX(" + tear.x.toFixed(1) + "px)";
          } else {
            tearEl.style.opacity = "0";
          }

          // OSD number and the channel dial (one detent per change)
          var ch = t < SLIPS[0] ? "CH 02" : t < SLIPS[1] ? "CH 03" : "CH 04";
          if (ch !== lastCh) {
            osdEl.textContent = ch;
            lastCh = ch;
          }
          var ang = -60;
          for (var q = 0; q < SLIPS.length; q++) ang += 30 * p3out(clamp01((t - (SLIPS[q] - 0.08)) / 0.14));
          dialEl.setAttribute("transform", "rotate(" + ang.toFixed(2) + " " + r1(dX) + " " + r1(pMid) + ")");

          // the picture: rolls up unlocked on CH 04, then catches in one sync-lock move
          var py = 0.45, pxo = 0, rgbAmp = 0;
          if (t >= T_HUNT && t < T_LOCK) {
            py = 0.45 - 0.29 * ((t - T_HUNT) / (T_LOCK - T_HUNT));
            pxo = (glitchHash(g * 13 + 5) * 2 - 1) * JIT;
            rgbAmp = 0.35;
          } else if (t >= T_LOCK && t < T_LOCK + 0.42) {
            var lu = (t - T_LOCK) / 0.42;
            py = 0.16 * (1 - p3out(lu));
            pxo = (glitchHash(g * 13 + 5) * 2 - 1) * JIT * (1 - lu) * (1 - lu);
            var ru = (t - T_LOCK) / 0.4;
            rgbAmp = ru < 1 ? 1 - p3in(ru) : 0;
          } else if (t >= T_LOCK + 0.42) {
            py = 0;
          }
          picEl.style.transform = "translate(" + pxo.toFixed(2) + "px," + (py * SH).toFixed(2) + "px)";
          setRgb(picRgb, rgbAmp, f, 31, 0.11 * FS, 0.8);

          // camera: slow creep, then the push through the glass (log-scale eased, so the zoom rate is smooth)
          var lnG, e = 0;
          if (t < P0) {
            lnG = (LN_CREEP * t) / P0;
          } else {
            e = p2io(clamp01((t - P0) / (P1 - P0)));
            lnG = LN_CREEP + (LN_END - LN_CREEP) * e;
          }
          var G = Math.exp(lnG);
          var D = 1 - 1 / G;
          var S = K / (K - D);
          var ox = (CX - SCX) * e, oy = (CY - SCY) * e;
          camEl.style.transform = "translate(" + ox.toFixed(2) + "px," + oy.toFixed(2) + "px) scale(" + G.toFixed(5) + ")";
          var creep = t > P1 ? 1 + (0.012 * (t - P1)) / (DUR - P1) : 1;
          wrapEl.style.transform = "scale(" + ((S * creep) / G).toFixed(5) + ")";
        }
        var clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              frame(clock.t);
            },
          },
          0,
        );
        frame(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
