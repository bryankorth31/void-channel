<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- VoidTV PLAY d-pad well, from Lexrom's (Bryan's lexROM, 2026-02-05): a recessed round well under the cross. -->
<defs>
<radialGradient id="w" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#1a1828"/><stop offset="1" stop-color="#0e0c18"/></radialGradient>
<radialGradient id="in" cx=".5" cy=".56" r=".52"><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
<radialGradient id="lip" cx=".5" cy=".44" r=".51"><stop offset=".93" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></radialGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<circle cx="100" cy="104" r="94" fill="#000" opacity=".6" filter="url(#s)"/>
<circle cx="100" cy="100" r="95" fill="url(#lip)"/>
<circle cx="100" cy="100" r="94" fill="url(#w)"/>
<circle cx="100" cy="100" r="94" fill="url(#in)"/>
</svg>
