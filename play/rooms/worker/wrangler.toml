# VoidTV rooms: the phone relay's Durable Object (phone controllers and Trivia Nights). Licence: GPL-2.0-or-later.
# Deploy from Bryan's own terminal, logged in to the CASH Cloudflare account: cd play/rooms/worker && npx wrangler deploy
# Then, on the Pages project voidtvsite: Settings > Bindings > Add > Durable Object: name ROOMS, Worker voidtv-rooms, class Room
# (for Production and for Preview).
name = "voidtv-rooms"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
