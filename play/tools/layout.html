<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY controller layout</title>
<!-- VoidTV PLAY: the controller layout editor. Licence: GPL-2.0-or-later (play/LICENSE). On this PC only, through
     node play/serve.js (the site never copies play/tools).
     Bryan, 21 Nov 2026: "i want a mock up of the controllers created for me with all parts moveaple ie dpad , button
     areas etc so that i can finetune this layout onece and for all since it is now more janky."
     The frame holds the real pad page, drawn at a real phone's size. Every part can be dragged and resized. Save writes
     play/layouts.json, the file the real pads place their parts from (src/padlayout.js), so what is set here is what
     players get after the next push. -->
<style>
:root{--bg:#07080c;--panel:#0f1118;--line:#232838;--fg:#e8e8ee;--dim:#9aa0b6;--acc:#5fd4ff;--pink:#ff4fc8;--gold:#f2a93b;--ok:#5fe39a;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button,select,input,a.btn{font:600 13px system-ui,sans-serif;color:var(--fg);background:#161b2a;border:1px solid #2a3044;border-radius:8px;padding:0 10px;height:32px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,select:hover,a.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default;border-color:#2a3044}
button.go{background:var(--acc);color:#07080c;border:0}
button.on{background:#20304a;border-color:var(--acc)}
input[type=number]{width:74px;cursor:text;padding:0 6px}
header{flex:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
header .back{width:36px;justify-content:center;font-size:18px;padding:0}
header h1{font-size:15px;margin:0 6px 0 2px}
header .grow{flex:1}
#say{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#say.ok{color:var(--ok)}#say.bad{color:var(--bad)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 292px}
#stage{position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#12141d 0%,#07080c 75%)}
#stage.full{overflow:auto;place-items:start center;padding:14px 0}
#fit{position:relative}
#phone{position:absolute;left:0;top:0;transform-origin:0 0;border:10px solid #1b1e2a;border-radius:34px;background:#000;box-shadow:0 0 0 2px #2c3144,0 18px 40px rgba(0,0,0,.6);overflow:hidden}
#frame{display:block;border:0;width:100%;height:100%;pointer-events:none}
#over{position:absolute;inset:0;touch-action:none}
.h{position:absolute;border:2px dashed rgba(95,212,255,.75);border-radius:8px;cursor:move;touch-action:none}
.h.round{border-radius:50%}
.h:hover{background:rgba(95,212,255,.10)}
.h.sel{border-style:solid;border-color:var(--pink);background:rgba(255,79,200,.10)}
.h.bad{border-color:var(--bad);background:rgba(255,107,107,.16)}
.h b{position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);font:700 11px system-ui,sans-serif;color:#07080c;background:var(--acc);border-radius:5px;padding:1px 6px;white-space:nowrap;pointer-events:none;display:none;z-index:2}
.h:hover b,.h.sel b{display:block}
.h.sel b{background:var(--pink)}
.h.low b{top:auto;bottom:-2px;transform:translate(-50%,100%)}
.h i{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--fg);border:3px solid #07080c;cursor:nwse-resize;touch-action:none}
.h.sel i{background:var(--pink)}
.g{position:absolute;background:var(--gold);pointer-events:none}
.g.v{top:0;bottom:0;width:1px}.g.hz{left:0;right:0;height:1px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px 16px}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
aside h2:first-child{margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.row label{color:var(--dim);min-width:92px}
.row select{flex:1;min-width:0}
#spread[hidden]{display:none}
#kind:empty{display:none}
#parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#parts button{justify-content:flex-start;overflow:hidden}
#parts button.bad{border-color:var(--bad)}
#fits{margin:0;padding:0;list-style:none;color:var(--dim)}
#fits li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
#fits .ok{color:var(--ok)}#fits .bad{color:var(--bad)}
.hint{color:var(--dim);font-size:12.5px;margin:6px 0 0}
kbd{font:600 11px ui-monospace,Consolas,monospace;background:#161b2a;border:1px solid #2a3044;border-radius:4px;padding:0 4px}
@media (max-width:760px){
  header{flex-wrap:wrap;padding:6px 8px;gap:6px}
  header h1,header .grow{display:none}
  #say{order:9;flex-basis:100%;white-space:normal}
  #say:empty{display:none}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:42vh}
}
</style>
</head>
<body>
<header>
  <a class="btn back" href="../" title="Back to PLAY">&#8592;</a>
  <h1>Controller layout</h1>
  <select id="pad" title="Which controller to set: the phone used as a game pad, or PLAY's own buttons on a phone's screen"></select>
  <button id="way-side" title="Set the layout for a phone held sideways">Sideways</button>
  <button id="way-up" title="Set the layout for a phone held upright">Upright</button>
  <button id="zoom" title="Show the phone at its true size and scroll to see all of it, or shrink it to fit this window">True size</button>
  <span class="grow"></span>
  <span id="say" role="status"></span>
  <button id="undo" title="Take back the last move (Ctrl+Z)">Undo</button>
  <button id="save" class="go" title="Write this layout to play/layouts.json, the file the real pads read. Players get it after the next push.">Save</button>
</header>
<main>
  <div id="stage"><div id="fit"><div id="phone"><iframe id="frame" title="The real pad"></iframe><div id="over"></div></div></div></div>
  <aside>
    <h2>Looking at</h2>
    <div class="row"><label for="phone-size">Phone</label><select id="phone-size" title="The size of phone the frame shows. The layout is kept in a form that fits every phone; this only changes the one you look at."></select></div>
    <p class="hint" id="kind"></p>
    <div class="row"><label for="game">Buttons of</label><select id="game" title="Which machine's buttons to draw. The button area keeps one place; its buttons change with the machine."></select></div>
    <h2>Parts</h2>
    <div id="parts"></div>
    <p class="hint">Drag a part to move it. Drag its round corner to resize. Arrow keys move the chosen part one pixel, ten with <kbd>Shift</kbd>.</p>
    <h2 id="sel-name">No part chosen</h2>
    <div class="row"><label for="n-x" id="l-x">From the edge</label><input id="n-x" type="number" step="1" title="The gap between this part and the edge it keeps to, in pixels on this phone"><span class="hint" id="u-x"></span></div>
    <div class="row"><label for="n-y" id="l-y">From the edge</label><input id="n-y" type="number" step="1" title="The gap between this part and the top or bottom edge it keeps to, in pixels on this phone"><span class="hint" id="u-y"></span></div>
    <div class="row"><label for="n-w">Wide</label><input id="n-w" type="number" step="1" min="20" title="How wide this part is, in pixels on this phone"><label for="n-h" style="min-width:0">Tall</label><input id="n-h" type="number" step="1" min="20" title="How tall this part is, in pixels on this phone"></div>
    <div class="row">
      <button id="mirror" title="Give this part the same size and the same gaps as its partner on the other side (the d-pad and the buttons, L and R, Select and Start)">Match its partner</button>
      <button id="center" title="Put this part in the middle of the screen, left to right">Centre</button>
    </div>
    <h2>Whole layout</h2>
    <div class="row">
      <button id="snap" class="on" title="While dragging, line a part up with the edges and middles of the other parts">Line up: on</button>
      <button id="builtin" title="Throw this layout away and go back to the pad's built-in one. Nothing changes for players until you Save.">Built-in layout</button>
      <button id="spread" hidden title="Give this layout to the on-screen pads of the other machines too (two, three, four buttons and one), so every game has its parts in the same places">Use for every machine</button>
    </div>
    <h2>Fits these phones</h2>
    <ul id="fits"></ul>
    <p class="hint" id="where"></p>
  </aside>
</main>
<script src="../src/keys.js"></script>
<script src="../src/cards.js"></script>
<script src="../src/hub.js"></script>
<script src="../src/touchpad.js"></script>
<script src="../src/phones.js"></script>
<script src="../src/padlayout.js"></script>
<script src="layout-editor.js"></script>
</body>
</html>
