<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY arcade boot check</title>
<style>
  body{margin:0;background:#07080c;color:#e8e8ee;font:14px system-ui,sans-serif;padding:16px}
  #canvas{display:block;width:448px;height:576px;image-rendering:pixelated;background:#000;margin-top:12px}
  pre{white-space:pre-wrap;max-height:180px;overflow:auto}
</style>
</head>
<body>
<!-- VoidTV PLAY: a test page that boots one arcade game on a MAME web build, sound off, outside the player.
     Licence: GPL-2.0-or-later. MAME's own web build is not a libretro core: it reads a global Module (canvas,
     arguments, preRun) and runs MAME's main(). Served by play/serve.js, e.g.
     http://127.0.0.1:8789/play/test/arcade.html?engine=../engine/mame/williams&item=arcade_joust&zip=joust.zip&driver=joust
     The engine's wasm is kept gzipped (<engine>.wasm.gz), as the arcade runner loads it; a plain <engine>.wasm also works.
     More zips: &parents=arcade_sfa2/qsound_hle.zip or &parents=arcade_qbert/votrax.zip:votrsc01a.zip (comma separated). -->
<pre id="out">starting</pre>
<canvas id="canvas" tabindex="0"></canvas>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const state = window.__arcade = { status: [], error: null, frames: 0, firstFrameMs: null, log: [] };
  const show = () => { out.textContent = JSON.stringify(Object.assign({}, state, { log: state.log.slice(-12) }), null, 1); };
  const t0 = performance.now();
  const say = (s) => { state.status.push(s); show(); };
  try {
    const driver = q.get('driver'), zip = q.get('zip'), item = q.get('item');
    say('Fetching the game from the Internet Archive');
    const res = await fetch('https://archive.org/cors/' + item + '/' + encodeURIComponent(zip));
    if (!res.ok) throw new Error('Archive answered ' + res.status);
    const bytes = new Uint8Array(await res.arrayBuffer());
    state.zipBytes = bytes.length;
    // &parents=item/file[:saveas],... : more zips the machine needs (a device's chips such as qsound_hle.zip, a parent
    // set), fetched the same way. ":saveas" stores one under the name MAME 0.289 looks for (votrax.zip:votrsc01a.zip).
    const extra = [];
    for (const p of (q.get('parents') || '').split(',').filter(Boolean)) {
      const [where, as] = p.split(':'), cut = where.indexOf('/');
      const pItem = where.slice(0, cut), pFile = where.slice(cut + 1);
      const r = await fetch('https://archive.org/cors/' + pItem + '/' + pFile.split('/').map(encodeURIComponent).join('/'));
      if (!r.ok) throw new Error('Archive answered ' + r.status + ' for ' + where);
      extra.push({ name: as || pFile.split('/').pop(), bytes: new Uint8Array(await r.arrayBuffer()) });
    }
    state.parents = extra.map((e) => e.name + ' ' + e.bytes.length);
    say('Starting MAME');
    const canvas = document.getElementById('canvas');
    window.Module = {
      canvas,
      // &args= replaces the arguments for a check (comma separated); the default plays the game, sound off.
      arguments: q.get('args') ? q.get('args').split(',') : [driver, '-rompath', '/roms', '-sound', 'none', '-window',
        '-nomaximize', '-skip_gameinfo', '-nokeepaspect', '-resolution', '448x576', '-video', q.get('video') || 'accel', '-verbose'],
      // The classic (not modular) build keeps its file system in a page-wide FS.
      preRun: [() => {
        const fs = Module.FS || window.FS; fs.mkdir('/roms'); fs.writeFile('/roms/' + zip, bytes);
        for (const e of extra) fs.writeFile('/roms/' + e.name, e.bytes);
        // &clock=1: a small Lua script prints MAME's emulated time each emulated second (add
        // -autoboot_script,/s/clock.lua to &args); the page stamps each with the real time to measure speed.
        if (q.get('clock')) {
          fs.mkdir('/s');
          fs.writeFile('/s/clock.lua', 'local last = -1\nsub = emu.add_machine_frame_notifier(function()\n' +
            '  local t = math.floor(manager.machine.time:as_double())\n  if t ~= last then last = t; print("EMUTIME " .. t) end\nend)\n');
        }
      }],
      locateFile: (f) => q.get('engine').replace(/[^/]*$/, '') + f,
      print: (t) => {
        const m = /^EMUTIME (\d+)/.exec(t);
        if (m) { (state.clock = state.clock || []).push([+m[1], Math.round(performance.now() - t0)]); return; }
        state.log.push(t); if (state.log.length > 400) state.log.shift();
      },
      printErr: (t) => { state.log.push('! ' + t); if (state.log.length > 400) state.log.shift(); },
      onAbort: (w) => { state.error = 'abort: ' + w; show(); },
    };
    // Count drawn pictures by watching the canvas change.
    let last = 0;
    setInterval(() => {
      try {
        const c = document.createElement('canvas'); c.width = 32; c.height = 32;
        c.getContext('2d').drawImage(canvas, 0, 0, 32, 32);
        const d = c.getContext('2d').getImageData(0, 0, 32, 32).data; let h = 0;
        for (let i = 0; i < d.length; i += 4) h = (h * 31 + d[i] + d[i + 1] * 3 + d[i + 2] * 7) | 0;
        if (h !== last) { last = h; state.frames++; if (state.firstFrameMs === null && h !== 0) state.firstFrameMs = Math.round(performance.now() - t0); }
      } catch (e) { /* canvas not ready */ }
      show();
    }, 250);
    // &timing=immediate: run the main loop as fast as the page allows (postMessage, not throttled in a hidden page),
    // to measure raw speed with -nothrottle -str N; the page notes when MAME prints its exit lines.
    if (q.get('timing') === 'immediate') {
      const t = setInterval(() => {
        if (typeof window._emscripten_set_main_loop_timing === 'function' && (window.MainLoop || {}).func) {
          window._emscripten_set_main_loop_timing(2, 0); state.unpacedAtMs = Math.round(performance.now() - t0); clearInterval(t);
          // The loop may be waiting on a frame callback that never comes (a pane the app keeps hidden): schedule it now.
          try { window.MainLoop.scheduler(); } catch (e) { state.kickError = String(e); }
          // Count MAME's main-loop calls (each one emulates 1/60 s) and the time spent inside them; the last call
          // marks where -str made MAME stop.
          const ml = window.MainLoop, f = ml.func; state.calls = 0; state.msInside = 0;
          ml.func = function () { const a = performance.now(); state.calls++; try { return f.apply(this, arguments); } finally { const b = performance.now(); state.msInside += b - a; state.lastCallAtMs = Math.round(b - t0); } };
        }
      }, 20);
      const origPrint = window.Module.print;
      window.Module.print = (txt) => { origPrint(txt); if (/Average speed|exiting|Exit/i.test(txt)) state.exitAtMs = Math.round(performance.now() - t0); };
    }
    // The engine is kept gzipped: unpack it here and hand it to Emscripten through instantiateWasm (MAME's build
    // ignores wasmBinary and would fetch the plain .wasm). Only real wasm (starting "\0asm") is used.
    const gz = await fetch(q.get('engine') + '.wasm.gz');
    if (gz.ok) {
      let buf = new Uint8Array(await gz.arrayBuffer());
      if (buf[0] === 0x1f && buf[1] === 0x8b) buf = new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
      if (buf[0] === 0 && buf[1] === 0x61 && buf[2] === 0x73 && buf[3] === 0x6d) {
        state.engineBytes = buf.length;
        window.Module.instantiateWasm = (imports, done) => {
          WebAssembly.instantiate(buf, imports).then((r) => done(r.instance, r.module), (e) => { state.error = 'engine start: ' + e; show(); });
          return {};
        };
      }
    }
    const s = document.createElement('script');
    s.src = q.get('engine') + '.js';
    s.onerror = () => { state.error = 'engine script did not load'; show(); };
    document.body.appendChild(s);
  } catch (e) { state.error = String(e.message || e); show(); }
})();
</script>
</body>
</html>
