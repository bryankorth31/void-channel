# CI: two checks on every push to master and every pull request.
# 1) The repo's own tests and the player's tests pass. 2) The web bundle must compile.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest   # HQ and its tests use PowerShell; the repo runs on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # node --test takes a glob from 22 on; 24 is what this PC runs
      - name: Repo tests
        run: node --test "tests/*.test.js"
      - name: Player tests (no browser, no network)
        run: node --test "player/test/*.test.js"

  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install app deps
        run: cd mobile && npm ci || npm install
      - name: Export web bundle (the compile gate)
        run: cd mobile && npx expo export --platform web --output-dir ../.ci-dist
